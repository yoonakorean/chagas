<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種跟讀關卡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-dark: #46a302;
            --duo-blue: #1cb0f6;
            --duo-red: #ff4b4b;
            --duo-yellow: #ffc800;
            --duo-gray: #e5e7eb;
            --duo-dark: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .game-container {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
            min-height: 90vh;
        }

        .step-page { display: none; padding: 20px; }
        .step-page.active { display: block; }

        /* 👑 1. 頂部玩家狀態列 */
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 2px solid #e5e7eb;
            background: white;
            font-weight: bold;
            font-size: 0.9rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-fire { color: #ff9600; }
        .icon-star { color: var(--duo-yellow); }
        .icon-bolt { color: #ce82ff; }

        /* 🗺️ 2. 單元綠色橫幅 (Unit Banner) */
        .unit-banner {
            background: var(--duo-green);
            color: white;
            border-radius: 16px;
            padding: 16px;
            margin: 15px 0 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 var(--duo-green-dark);
        }

        .unit-info h3 { margin: 0; font-size: 1.1rem; }
        .unit-info p { margin: 4px 0 0 0; font-size: 0.85rem; opacity: 0.9; }

        .btn-unit-list {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* 🗺️ 3. S型地圖關卡節點 (Path) */
        .map-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 10px 0 30px 0;
            position: relative;
        }

        /* 兩側交錯定位：中間 -> 右 -> 中間 -> 左 -> 中間 */
        .stage-node { position: relative; }
        .stage-node:nth-child(5n+1) { transform: translateX(0); }
        .stage-node:nth-child(5n+2) { transform: translateX(45px); }
        .stage-node:nth-child(5n+3) { transform: translateX(70px); }
        .stage-node:nth-child(5n+4) { transform: translateX(35px); }
        .stage-node:nth-child(5n+5) { transform: translateX(-35px); }

        /* 圓形關卡勳章按鈕 */
        .btn-stage-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--duo-yellow);
            border: none;
            box-shadow: 0 6px 0 #e5a900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            transition: all 0.1s;
        }

        .btn-stage-circle:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #e5a900;
        }

        /* 未解鎖或普通關卡顏色變化 */
        .btn-stage-circle.blue { background: var(--duo-blue); box-shadow: 0 6px 0 #1899d6; }
        .btn-stage-circle.green { background: var(--duo-green); box-shadow: 0 6px 0 var(--duo-green-dark); }
        .btn-stage-circle.locked { background: #e5e7eb; box-shadow: 0 6px 0 #d1d5db; color: #9ca3af; cursor: not-allowed; }

        .stage-label {
            position: absolute;
            left: -110px;
            top: 18px;
            background: white;
            border: 2px solid #e5e7eb;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #4b5563;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            white-space: nowrap;
        }

        /* 通用按鈕與選單 */
        .option-grid { display: grid; gap: 12px; margin-bottom: 20px; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }

        .btn-option {
            background: white;
            border: 2px solid #e5e7eb;
            border-bottom: 4px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px 10px;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--duo-dark);
            cursor: pointer;
        }

        .btn-option.selected {
            border-color: var(--duo-blue) !important;
            border-bottom-color: #1899d6 !important;
            background-color: #ddf4ff !important;
            color: var(--duo-blue) !important;
        }

        .btn-confirm {
            width: 100%;
            background: var(--duo-green);
            color: white;
            border: none;
            border-bottom: 4px solid #46a302;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
        }

        /* 挑戰頁面 */
        .target-text { font-size: 1.8rem; font-weight: bold; color: #1f2937; margin: 20px 0 10px 0; }
        .translation-text { font-size: 1.1rem; color: #6b7280; margin-bottom: 25px; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .btn-circle-action { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.3rem; color: white; }
        .btn-listen { background: var(--duo-blue); box-shadow: 0 4px 0 #1899d6; }
        .btn-record { background: var(--duo-red); box-shadow: 0 4px 0 #ea2b2b; }
        .result-box { background: #f3f4f6; border-radius: 12px; padding: 12px; font-size: 0.95rem; }
        .score-badge { font-size: 1.2rem; font-weight: bold; color: var(--duo-green); margin-top: 5px; }
        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .btn-nav { background: #f3f4f6; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">

    <!-- 👑 頂部遊戲狀態列 -->
    <div class="status-header">
        <div class="status-item"><i class="fa-solid fa-user" style="color:var(--duo-blue);"></i> <span id="lbl-user-name">釣魚小天才</span></div>
        <div class="status-item"><i class="fa-solid fa-fire icon-fire"></i> 1 天</div>
        <div class="status-item"><i class="fa-solid fa-star icon-star"></i> 0</div>
        <div class="status-item"><i class="fa-solid fa-bolt icon-bolt"></i> 100</div>
        <div class="status-item" style="cursor: pointer;" onclick="goToStep('step-level')">
            <span id="lbl-current-level" style="color:var(--duo-blue);">0A</span> <i class="fa-solid fa-caret-down"></i>
        </div>
    </div>

    <!-- 步驟 1：語言選擇 -->
    <div id="step-lang" class="step-page active">
        <h2 style="margin-top:10px;">請選擇語言設定</h2>
        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">學習語言：</p>
        <div class="option-grid grid-3">
            <button class="btn-option" id="btn-cat-korean" onclick="selectCategory('korean')">🇰🇷 韓文</button>
            <button class="btn-option" id="btn-cat-japanese" onclick="selectCategory('japanese')">🇯🇵 日文</button>
            <button class="btn-option" id="btn-cat-english" onclick="selectCategory('english')">🇺🇸 英文</button>
        </div>
        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">母語翻譯：</p>
        <div class="option-grid grid-3">
            <button class="btn-option" id="btn-lang-zh" onclick="setUserLang('zh')">繁中文</button>
            <button class="btn-option" id="btn-lang-en" onclick="setUserLang('en')">English</button>
            <button class="btn-option" id="btn-lang-ja" onclick="setUserLang('ja')">日本語</button>
        </div>
        <button class="btn-confirm" id="btn-confirm-lang" onclick="confirmLangSetting()">確定並開啟冒險</button>
    </div>

    <!-- 步驟 2：程度選擇 (Level) -->
    <div id="step-level" class="step-page">
        <h2>選擇學習程度 (Level)</h2>
        <div class="option-grid grid-2" id="container-levels"></div>
    </div>

    <!-- 🗺️ 步驟 3：遊戲地圖畫面 (Map / Stages) -->
    <div id="step-map" class="step-page">
        <!-- 綠色單元 Banner -->
        <div class="unit-banner">
            <div class="unit-info">
                <h3 id="lbl-unit-title">單元一：請給我兩杯咖啡</h3>
                <p id="lbl-unit-subtitle">單元 1 關卡路線</p>
            </div>
            <button class="btn-unit-list" onclick="goToStep('step-level')"><i class="fa-solid fa-bars"></i></button>
        </div>

        <!-- S型交錯關卡路線 -->
        <div class="map-path" id="container-map-path">
            <!-- 動態生成地圖關卡點 -->
        </div>
    </div>

    <!-- 步驟 4：跟讀挑戰畫面 -->
    <div id="step-quiz" class="step-page">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button class="btn-nav" onclick="goToStep('step-map')"><i class="fa-solid fa-arrow-left"></i> 回地圖</button>
            <span id="lbl-quiz-info" style="font-size:0.85rem; color:#9ca3af;">韓文 | 0A | 單元 1 | 第 1 關</span>
        </div>

        <div class="target-text" id="lbl-target-text">載入中...</div>
        <div class="translation-text" id="lbl-translation">...</div>

        <div class="controls">
            <button class="btn-circle-action btn-listen" id="btn-play-audio"><i class="fa-solid fa-volume-high"></i></button>
            <button class="btn-circle-action btn-record" id="btn-start-record"><i class="fa-solid fa-microphone"></i></button>
        </div>

        <div class="result-box">
            <div>辨識結果：<span id="lbl-recognized-text" style="font-weight: bold;">-</span></div>
            <div class="score-badge" id="lbl-score">得分：--</div>
        </div>

        <div class="nav-controls">
            <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">上一題</button>
            <span id="lbl-progress" style="color: #6b7280;">0 / 0</span>
            <button class="btn-nav" id="btn-next" onclick="nextQuestion()">下一題</button>
        </div>
    </div>

</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxNtJt1URgct9-T_yzXowKGvHeM5l17NiwviOs8ySwIbrdWD6zfctdCCx7YpMu3P7zG/exec";

    let currentConfig = { category: 'korean', level: '0A', unit_id: '1', stage: '1', lang: 'zh' };
    let globalCategoryData = []; 
    let questions = [];
    let currentIndex = 0;
    let recognition = null;

    function goToStep(stepId) {
        document.querySelectorAll('.step-page').forEach(page => page.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function selectCategory(category) {
        currentConfig.category = category;
        ['korean', 'japanese', 'english'].forEach(c => {
            const btn = document.getElementById(`btn-cat-${c}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-cat-${category}`).classList.add('selected');
    }

    function setUserLang(lang) {
        currentConfig.lang = lang;
        ['zh', 'en', 'ja'].forEach(l => {
            const btn = document.getElementById(`btn-lang-${l}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-lang-${lang}`).classList.add('selected');
    }

    async function confirmLangSetting() {
        const cacheKey = `shadowing_data_${currentConfig.category}`;
        const cachedData = localStorage.getItem(cacheKey);

        if (cachedData) {
            globalCategoryData = JSON.parse(cachedData);
            renderLevels();
            goToStep('step-level');
            return;
        }

        const btn = document.getElementById('btn-confirm-lang');
        btn.disabled = true;
        btn.innerText = "載入地圖資料中...";

        try {
            const res = await fetch(`${GAS_API_URL}?action=getLanguageData&category=${encodeURIComponent(currentConfig.category)}`);
            const data = await res.json();
            if (data.status === 'success') {
                globalCategoryData = data.data;
                localStorage.setItem(cacheKey, JSON.stringify(data.data));
                renderLevels();
                goToStep('step-level');
            }
        } catch(e) { alert("連線失敗"); }
        finally { btn.disabled = false; btn.innerText = "確定並開啟冒險"; }
    }

    function renderLevels() {
        const container = document.getElementById('container-levels');
        container.innerHTML = "";
        const levelsSet = [...new Set(globalCategoryData.map(item => String(item[1]).toUpperCase()))].filter(Boolean);
        const displayLevels = levelsSet.length > 0 ? levelsSet.sort() : ['0A', '0B', '1A', '1B'];

        displayLevels.forEach(lvl => {
            const btn = document.createElement('button');
            btn.className = "btn-option";
            btn.innerText = lvl;
            btn.onclick = () => selectLevel(lvl);
            container.appendChild(btn);
        });
    }

    function selectLevel(level) {
        currentConfig.level = level;
        document.getElementById('lbl-current-level').innerText = level;
        renderMapPath();
        goToStep('step-map');
    }

    // 🗺️ 動態繪製多鄰國風格 S 型地圖
    function renderMapPath() {
        const container = document.getElementById('container-map-path');
        container.innerHTML = "";

        // 篩選該 Level 下的所有資料
        const filtered = globalCategoryData.filter(i => String(i[1]).toUpperCase() === currentConfig.level.toUpperCase());
        const stages = [...new Set(filtered.map(i => i[3]))].filter(Boolean).sort((a,b) => a - b);

        const icons = ['fa-pen-nib', 'fa-headphones', 'fa-dumbbell', 'fa-microphone', 'fa-comment', 'fa-flag'];
        const colors = ['green', 'blue', 'yellow', 'green', 'blue', 'yellow'];

        if (stages.length === 0) {
            container.innerHTML = "<p style='color:#6b7280;'>此等級暫無關卡</p>";
            return;
        }

        stages.forEach((stg, index) => {
            const node = document.createElement('div');
            node.className = "stage-node";

            const iconClass = icons[index % icons.length];
            const colorClass = colors[index % colors.length];

            node.innerHTML = `
                <div class="stage-label">第 ${stg} 關</div>
                <button class="btn-stage-circle ${colorClass}" onclick="startChallenge('${stg}')">
                    <i class="fa-solid ${iconClass}"></i>
                </button>
            `;
            container.appendChild(node);
        });
    }

    function startChallenge(stage) {
        currentConfig.stage = stage;
        goToStep('step-quiz');
        
        document.getElementById('lbl-quiz-info').innerText = `${currentConfig.category.toUpperCase()} | Level ${currentConfig.level} | 第 ${stage} 關`;

        const langIndexMap = { 'zh': 5, 'en': 6, 'ja': 7 };
        const langIdx = langIndexMap[currentConfig.lang] || 5;

        questions = globalCategoryData.filter(i => 
            String(i[1]).toUpperCase() === currentConfig.level.toUpperCase() &&
            String(i[3]) === String(stage)
        ).map(i => ({ id: i[0], text: i[4], translation: i[langIdx] || i[5] || '', audioUrl: i[8] }));

        currentIndex = 0;
        if (questions.length > 0) displayQuestion();
    }

    function displayQuestion() {
        const q = questions[currentIndex];
        document.getElementById('lbl-target-text').innerText = q.text || "無題目";
        document.getElementById('lbl-translation').innerText = q.translation || "";
        document.getElementById('lbl-recognized-text').innerText = "-";
        document.getElementById('lbl-score').innerText = "得分：--";
        document.getElementById('lbl-progress').innerText = `${currentIndex + 1} / ${questions.length}`;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
    }

    function nextQuestion() { if (currentIndex < questions.length - 1) { currentIndex++; displayQuestion(); } }
    function prevQuestion() { if (currentIndex > 0) { currentIndex--; displayQuestion(); } }

    window.onload = () => {
        selectCategory('korean');
        setUserLang('zh');
    };
</script>

</body>
</html>
