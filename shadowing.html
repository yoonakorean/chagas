<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種跟讀關卡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-blue: #1cb0f6;
            --duo-red: #ff4b4b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .shadowing-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .lang-setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .target-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1f2937;
            margin: 15px 0 5px 0;
        }

        .translation-text {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-listen { background: var(--duo-blue); box-shadow: 0 4px 0 #1899d6; }
        .btn-record { background: var(--duo-red); box-shadow: 0 4px 0 #ea2b2b; }
        .btn-record.recording { animation: pulse 1s infinite; background: #dc2626; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .score-badge {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--duo-green);
            margin-top: 5px;
        }

        select {
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body>

<div class="shadowing-card">
    <!-- 母語設定選單 -->
    <div class="lang-setting">
        <span><i class="fa-solid fa-language"></i> 我的母語翻譯：</span>
        <select id="select-user-lang">
            <option value="zh" selected>繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <hr style="border: 0; border-top: 1px solid #f3f4f6;">

    <!-- 題目區域 -->
    <div id="quiz-container">
        <div class="target-text" id="lbl-target-text">載入中...</div>
        <div class="translation-text" id="lbl-translation">...</div>

        <!-- 按鈕區 -->
        <div class="controls">
            <button class="btn-circle btn-listen" id="btn-play-audio" title="聽示範音">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="btn-circle btn-record" id="btn-start-record" title="開始跟讀">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <!-- 比對結果區 -->
        <div class="result-box">
            <div>辨識結果：<span id="lbl-recognized-text" style="font-weight: bold; color: #374151;">-</span></div>
            <div class="score-badge" id="lbl-score">得分：--</div>
        </div>
    </div>
</div>

<script>
    // ⚠️ 請替換為你部署的 Google Apps Script URL
    const GAS_API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSwsesQll1rpp6Q-8zmAX8VyicBQEDzt9KzaRjyFVtG1wFfsZYYhtcKdu1W0OUmPPYQuk9kaVMx3G8MFHY64_AM9Mq-uUM6iPStrtSQk2u794ifuRXHsPpHqXLod8_PNt5i5nuyuv6khIddOowQxlKkC5PlbwRmBHshPEPwI9aj9b10dyvIB6xOkfd0dujE-I0NW53rqVYSneD45Cdk0cVH7RI7GCPYKs6eMdxf19JJqspvosTxRnmSuIWIpnwYxq8eFALGfKPhMgcEzwj1dDxuEJJSGw&lib=MyKU4uLo5kmKrVwkTmN3s2_UoIK4Mfmc2";

    // 當前關卡設定
    let currentConfig = {
        category: 'korean',
        level: '1A',
        unit_id: 1,
        stage: 1,
        lang: 'zh'
    };

    let questions = [];
    let currentIndex = 0;
    let recognition = null;

    // 1. 初始化語音辨識 (Web Speech API)
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("您的瀏覽器不支援語音辨識，建議使用 Chrome 瀏覽器！");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        // 設定辨識語言 (依據學習語種)
        const langMap = {
            'korean': 'ko-KR',
            'japanese': 'ja-JP',
            'english': 'en-US'
        };
        recognition.lang = langMap[currentConfig.category] || 'ko-KR';

        recognition.onstart = () => {
            const btn = document.getElementById('btn-start-record');
            btn.classList.add('recording');
        };

        recognition.onend = () => {
            const btn = document.getElementById('btn-start-record');
            btn.classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript;
            document.getElementById('lbl-recognized-text').innerText = userSpeech;
            
            // 計算比對分數
            const targetText = questions[currentIndex].text;
            const score = calculateSimilarity(targetText, userSpeech);
            document.getElementById('lbl-score').innerText = `得分：${score}分`;
        };
    }

    // 2. 從 GAS 後端載入題目
    async function loadQuestions() {
        document.getElementById('lbl-target-text').innerText = "載入題目中...";
        
        const url = `${GAS_API_URL}?action=getShadowingQuestions&category=${currentConfig.category}&level=${currentConfig.level}&unit_id=${currentConfig.unit_id}&stage=${currentConfig.stage}&lang=${currentConfig.lang}`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.status === 'success' && data.data.length > 0) {
                questions = data.data;
                currentIndex = 0;
                displayQuestion();
            } else {
                document.getElementById('lbl-target-text').innerText = "無相關題目";
                document.getElementById('lbl-translation').innerText = "";
            }
        } catch (err) {
            console.error(err);
            alert("題目載入失敗，請檢查 GAS 設定！");
        }
    }

    // 3. 顯示當前題目
    function displayQuestion() {
        const q = questions[currentIndex];
        document.getElementById('lbl-target-text').innerText = q.text;
        document.getElementById('lbl-translation').innerText = q.translation;
        document.getElementById('lbl-recognized-text').innerText = "-";
        document.getElementById('lbl-score').innerText = "得分：--";
    }

    // 4. 播放語音（優先使用音檔，無音檔則用瀏覽器 TTS）
    function playAudio() {
        const q = questions[currentIndex];
        if (q.audioUrl) {
            const audio = new Audio(q.audioUrl);
            audio.play();
        } else {
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(q.text);
            const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
            utterance.lang = langMap[currentConfig.category] || 'ko-KR';
            synth.speak(utterance);
        }
    }

    // 5. 簡易字串相似度算法 (Levenshtein Distance)
    function calculateSimilarity(str1, str2) {
        const s1 = str1.replace(/\s+/g, '').toLowerCase();
        const s2 = str2.replace(/\s+/g, '').toLowerCase();
        
        if (s1 === s2) return 100;
        
        let track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
        for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;

        for (let j = 1; j <= s2.length; j += 1) {
            for (let i = 1; i <= s1.length; i += 1) {
                const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        
        const distance = track[s2.length][s1.length];
        const maxLength = Math.max(s1.length, s2.length);
        const score = Math.round((1 - distance / maxLength) * 100);
        return score < 0 ? 0 : score;
    }

    // 事件監聽綁定
    document.getElementById('btn-play-audio').addEventListener('click', playAudio);
    
    document.getElementById('btn-start-record').addEventListener('click', () => {
        if (recognition) recognition.start();
    });

    document.getElementById('select-user-lang').addEventListener('change', (e) => {
        currentConfig.lang = e.target.value;
        loadQuestions(); // 根據選擇的母語重新載入翻譯
    });

    // 頁面初始化
    window.onload = () => {
        initSpeechRecognition();
        loadQuestions();
    };
</script>

</body>
</html>
