<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種語言學習關卡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-blue: #1cb0f6;
            --duo-red: #ff4b4b;
            --duo-gray: #e5e7eb;
            --duo-dark: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .shadowing-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        .step-page { display: none; }
        .step-page.active { display: block; }

        h2.step-title {
            color: var(--duo-dark);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .option-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }

        .btn-option {
            background: white;
            border: 2px solid #e5e7eb;
            border-bottom: 4px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px 10px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--duo-dark);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .btn-option:hover {
            border-color: var(--duo-blue);
            color: var(--duo-blue);
        }

        .btn-option.selected {
            border-color: var(--duo-blue) !important;
            border-bottom-color: #1899d6 !important;
            background-color: #ddf4ff !important;
            color: var(--duo-blue) !important;
        }

        .btn-confirm {
            width: 100%;
            background: var(--duo-green);
            color: white;
            border: none;
            border-bottom: 4px solid #46a302;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-confirm:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-sync-refresh {
            background: none;
            border: none;
            color: var(--duo-blue);
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-back-step {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .btn-back-step:hover { color: var(--duo-blue); }

        .target-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1f2937;
            margin: 15px 0 5px 0;
            min-height: 2.5rem;
        }

        .translation-text {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 8px;
            min-height: 1.5rem;
        }

        .hint-text {
            font-size: 0.9rem;
            color: #f59e0b;
            background-color: #fef3c7;
            padding: 6px 12px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-listen { background: var(--duo-blue); box-shadow: 0 4px 0 #1899d6; }
        .btn-record { background: var(--duo-red); box-shadow: 0 4px 0 #ea2b2b; }
        .btn-record.recording { animation: pulse 1s infinite; background: #dc2626; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .score-badge {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--duo-green);
            margin-top: 5px;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn-nav {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #374151;
        }

        .btn-nav:hover:not(:disabled) { background: #e5e7eb; }
        .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

        .challenge-header-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn-sub-nav {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            color: #4b5563;
        }

        .btn-sub-nav:hover { background: #e5e7eb; color: var(--duo-blue); }

        .block-zone {
            min-height: 70px;
            border-bottom: 2px dashed #cbd5e1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .block-chip {
            background: white;
            border: 2px solid #cbd5e1;
            border-bottom: 4px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--duo-dark);
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }

        .block-chip:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .block-chip.used {
            opacity: 0.3;
            pointer-events: none;
            background: #f3f4f6;
        }

        .grammar-dialog-box {
            background: #eef2ff;
            border: 2px solid #818cf8;
            border-radius: 16px;
            padding: 20px;
            font-size: 1.1rem;
            color: #312e81;
            text-align: left;
            margin-bottom: 15px;
            min-height: 90px;
            line-height: 1.6;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .grammar-q-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: left;
        }

        .blank-slot {
            display: inline-block;
            min-width: 80px;
            border-bottom: 3px solid var(--duo-blue);
            color: var(--duo-blue);
            text-align: center;
            padding: 0 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .grammar-nav-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-grammar-sub {
            flex: 1;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-bottom: 3px solid #d1d5db;
            padding: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #4b5563;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-grammar-sub:hover { background: #e5e7eb; color: var(--duo-dark); }
        .btn-grammar-sub:disabled { opacity: 0.4; cursor: not-allowed; }

        .dialog-history-list {
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .dialog-history-item {
            padding: 8px 10px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.95rem;
            color: #374151;
            line-height: 1.5;
        }

        .dialog-history-item:last-child { border-bottom: none; }
        .dialog-history-item span.num {
            font-weight: bold;
            color: var(--duo-blue);
            margin-right: 6px;
        }
        
        .btn-play-inline {
            background: var(--duo-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-left: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .btn-play-inline:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="shadowing-card">

    <!-- 步驟 1：選擇模式、母語與學習語言 -->
    <div id="step-lang" class="step-page active">
        <h2 class="step-title"><i class="fa-solid fa-gamepad"></i> 選擇學習模式與語言</h2>
        
        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">1. 選擇遊戲挑戰模式：</p>
        <div class="option-grid grid-2">
            <button class="btn-option selected" id="btn-mode-shadow" onclick="setGameMode('shadow')">🎙️ 跟讀練習</button>
            <button class="btn-option" id="btn-mode-blocks" onclick="setGameMode('blocks')">🧩 聽音重組字塊</button>
        </div>

        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">2. 你的母語（翻譯）：</p>
        <div class="option-grid grid-3">
            <button class="btn-option selected" id="btn-lang-zh" onclick="setUserLang('zh')">繁體中文</button>
            <button class="btn-option" id="btn-lang-en" onclick="setUserLang('en')">English</button>
            <button class="btn-option" id="btn-lang-kr" onclick="setUserLang('kr')">한국어</button>
        </div>

        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">3. 要學習的語言：</p>
        <div class="option-grid grid-3">
            <button class="btn-option selected" id="btn-cat-korean" onclick="selectCategory('korean')">🇰🇷 韓文</button>
            <button class="btn-option" id="btn-cat-japanese" onclick="selectCategory('japanese')">🇯🇵 日文</button>
            <button class="btn-option" id="btn-cat-english" onclick="selectCategory('english')">🇺🇸 英文</button>
        </div>

        <button class="btn-confirm" id="btn-confirm-lang" onclick="confirmLangSetting()"><i class="fa-solid fa-check"></i> 確定並進入</button>
        <button class="btn-sync-refresh" onclick="forceClearAndSync()"><i class="fa-solid fa-arrows-rotate"></i> 強制更新試算表資料</button>
        <div id="cache-status" style="font-size: 0.75rem; color: #9ca3af; margin-top: 8px;"></div>
    </div>

    <!-- 步驟 2：選擇課程程度 -->
    <div id="step-level" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-lang')"><i class="fa-solid fa-arrow-left"></i> 重選模式語言</button>
        </div>
        
        <h2 class="step-title"><i class="fa-solid fa-layer-group"></i> 選擇課程程度</h2>
        <div id="container-levels" class="option-grid grid-2"></div>
    </div>

    <!-- 步驟 3：選擇單元 (Unit) -->
    <div id="step-unit" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-level')"><i class="fa-solid fa-arrow-left"></i> 回程度選擇</button>
            <span id="lbl-unit-level" style="font-weight: bold; color: var(--duo-blue);">0A 認識字母</span>
        </div>
        
        <h2 class="step-title"><i class="fa-solid fa-book-open"></i> 請選擇單元 (Unit)</h2>
        <div id="container-units" class="option-grid grid-3"></div>
    </div>

    <!-- 步驟 4：選擇關卡 (Stage) -->
    <div id="step-stage" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-unit')"><i class="fa-solid fa-arrow-left"></i> 回單元選擇</button>
            <span id="lbl-stage-unit" style="font-weight: bold; color: var(--duo-blue);">單元 1</span>
        </div>

        <h2 class="step-title"><i class="fa-solid fa-flag-checkered"></i> 請選擇關卡 (Stage)</h2>
        <div id="container-stages" class="option-grid grid-3"></div>
    </div>

    <!-- 💡 步驟 4.5：語法說明頁面 -->
    <div id="step-grammar" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-stage')"><i class="fa-solid fa-arrow-left"></i> 回關卡選擇</button>
            <span id="lbl-grammar-info" style="font-weight: bold; color: var(--duo-blue);">語法教室</span>
        </div>

        <!-- 1. 對話框說明區塊 -->
        <div id="area-grammar-dialog">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 style="margin: 0; color: #4338ca;"><i class="fa-solid fa-lightbulb"></i> 觀念小教室</h3>
                <span id="lbl-dialog-counter" style="font-size: 0.85rem; color: #6b7280; font-weight: bold;">1 / 1</span>
            </div>

            <div class="grammar-dialog-box" id="lbl-grammar-dialog" onclick="completeTypewriterImmediately()">...</div>

            <button class="btn-confirm" id="btn-next-dialog" onclick="nextGrammarDialog()">下一步 <i class="fa-solid fa-arrow-right"></i></button>

            <div class="grammar-nav-btns">
                <button class="btn-grammar-sub" id="btn-prev-dialog" onclick="prevGrammarDialog()"><i class="fa-solid fa-arrow-left"></i> 上一步</button>
                <button class="btn-grammar-sub" onclick="skipGrammarDialog()"><i class="fa-solid fa-forward-step"></i> 跳過對話</button>
            </div>
        </div>

        <!-- 1.2 例句展示區塊 -->
        <div id="area-grammar-example" style="display: none;">
            <h3 style="margin-top: 10px; color: #4338ca; text-align: left;"><i class="fa-solid fa-book-bookmark"></i> 例句練習</h3>
            <div id="container-example-list" style="text-align: left; margin-bottom: 20px;"></div>
            <button class="btn-confirm" onclick="goToReadyPage()"><i class="fa-solid fa-arrow-right"></i> 繼續</button>
        </div>

        <!-- 1.3 Ready 進入測驗引導區塊 -->
        <div id="area-grammar-ready" style="display: none; text-align: center; padding: 20px 10px;">
            <i class="fa-solid fa-flag-checkered" style="font-size: 3rem; color: #818cf8; margin-bottom: 15px;"></i>
            <div id="lbl-ready-text" style="font-size: 1.3rem; font-weight: bold; color: var(--duo-dark); margin-bottom: 25px; line-height: 1.6;"></div>
            <button class="btn-confirm" onclick="enterGrammarQuizFromReady()"><i class="fa-solid fa-pen-to-square"></i> 開始測驗</button>
        </div>

        <!-- 2. 測驗填空區塊 -->
        <div id="area-grammar-quiz" style="display: none; margin-top: 15px;">
            <h3 style="margin-top: 0; color: var(--duo-dark);"><i class="fa-solid fa-pen-to-square"></i> 語法測驗</h3>
            <p style="font-size: 0.85rem; color: #6b7280; text-align: left; margin-bottom: 10px;">請點擊下方字塊填入正確答案：</p>
            
            <div id="container-grammar-questions"></div>

            <p style="font-size: 0.85rem; color: #6b7280; text-align: left; margin: 15px 0 5px 0;">選項：</p>
            <div id="container-grammar-choices" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;"></div>

            <button class="btn-confirm" id="btn-check-grammar" onclick="checkGrammarQuiz()"><i class="fa-solid fa-check"></i> 送出答案</button>

            <div class="result-box" id="box-grammar-result" style="display: none; margin-top: 15px;">
                <div id="lbl-grammar-result-text" style="font-size: 1.1rem; font-weight: bold;"></div>
                <button class="btn-confirm" id="btn-grammar-action" style="margin-top: 10px;"></button>
            </div>
        </div>

        <!-- 3. 觀念複習區塊 -->
        <div id="area-grammar-all-history" style="display: none; margin-top: 20px;">
            <h3 style="margin-top: 15px; margin-bottom: 10px; color: #4338ca; text-align: left;"><i class="fa-solid fa-list-check"></i> 觀念總覽</h3>
            <div class="dialog-history-list" id="container-dialog-history"></div>
        </div>
    </div>

    <!-- 步驟 5-A：跟讀挑戰畫面 -->
    <div id="step-quiz-shadow" class="step-page">
        <div class="challenge-header-btns">
            <button class="btn-sub-nav" onclick="goToStep('step-level')"><i class="fa-solid fa-layer-group"></i> 換程度</button>
            <button class="btn-sub-nav" onclick="goToStep('step-unit')"><i class="fa-solid fa-book-open"></i> 回單元</button>
            <button class="btn-sub-nav" onclick="goToStep('step-stage')"><i class="fa-solid fa-flag-checkered"></i> 回關卡</button>
        </div>

        <div style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px;" class="lbl-quiz-info"></div>

        <div class="target-text" id="lbl-target-text">載入中...</div>
        <div class="translation-text" id="lbl-translation">...</div>
        <div id="lbl-hint" class="hint-text" style="display: none;"></div>

        <div class="controls">
            <button class="btn-circle btn-listen" id="btn-play-audio" title="聽示範音">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="btn-circle btn-record" id="btn-start-record" title="開始跟讀">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <div class="result-box">
            <div>辨識結果：<span id="lbl-recognized-text" style="font-weight: bold; color: #374151;">-</span></div>
            <div class="score-badge" id="lbl-score">得分：--</div>
        </div>

        <div class="nav-controls">
            <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">上一題</button>
            <span class="lbl-progress" style="color: #6b7280; font-size: 0.9rem;">0 / 0</span>
            <button class="btn-nav" id="btn-next" onclick="nextQuestion()">下一題</button>
        </div>
    </div>

    <!-- 步驟 5-B：🧩 聽音重組字塊畫面 -->
    <div id="step-quiz-blocks" class="step-page">
        <div class="challenge-header-btns">
            <button class="btn-sub-nav" onclick="goToStep('step-level')"><i class="fa-solid fa-layer-group"></i> 換程度</button>
            <button class="btn-sub-nav" onclick="goToStep('step-unit')"><i class="fa-solid fa-book-open"></i> 回單元</button>
            <button class="btn-sub-nav" onclick="goToStep('step-stage')"><i class="fa-solid fa-flag-checkered"></i> 回關卡</button>
        </div>

        <div style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px;" class="lbl-quiz-info"></div>

        <div style="margin: 15px 0;">
            <button class="btn-circle btn-listen" onclick="playBlockAudio()" style="margin: 0 auto;">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>

        <div class="translation-text" id="lbl-block-translation">...</div>

        <p style="font-size: 0.8rem; color: #9ca3af; text-align: left; margin: 0;">排列結果：</p>
        <div id="zone-answer" class="block-zone"></div>

        <p style="font-size: 0.8rem; color: #9ca3af; text-align: left; margin: 0;">點擊字塊組句：</p>
        <div id="zone-options" class="block-zone" style="border-bottom: none; background: #f9fafb; border-radius: 12px;"></div>

        <button class="btn-confirm" onclick="checkBlockAnswer()"><i class="fa-solid fa-check"></i> 檢查答案</button>

        <div class="result-box" style="margin-top: 15px;">
            <div class="score-badge" id="lbl-block-score">等待回答...</div>
        </div>

        <div class="nav-controls">
            <button class="btn-nav" id="btn-block-prev" onclick="prevQuestion()">上一題</button>
            <span class="lbl-progress" style="color: #6b7280; font-size: 0.9rem;">0 / 0</span>
            <button class="btn-nav" id="btn-block-next" onclick="nextQuestion()">下一題</button>
        </div>
    </div>

</div>

<script>
    const API_URLS = {
        korean: "https://script.google.com/macros/s/AKfycbxNtJt1URgct9-T_yzXowKGvHeM5l17NiwviOs8ySwIbrdWD6zfctdCCx7YpMu3P7zG/exec",
        japanese: "https://script.google.com/macros/s/AKfycbQirnmmcIOXE3aEGSUHlJ62jvB18rLx4N6QXgN8PO53DZJGwGe1lPnNXUjjYZj01gskg/exec",
        english: ""
    };

    let currentConfig = {
        mode: 'shadow',
        category: 'korean',
        level: '',
        unit_id: '1',
        stage: '1',
        lang: 'zh'
    };

    let globalCategoryData = []; 
    let globalGrammarData = []; 
    let questions = [];
    let currentIndex = 0;
    let recognition = null;
    let isRecording = false;
    let selectedBlockIndices = [];

    let currentGrammarItem = null;
    let currentDialogIndex = 0;
    let userGrammarAnswers = [];
    let activeBlankIndex = 0;

    let typewriterTimer = null;
    let isTypewriterTyping = false;
    let currentFullDialogText = "";

    function stopSpeechRecognition() {
        if (recognition) {
            try {
                recognition.abort();
            } catch (e) {
                try { recognition.stop(); } catch(err) {}
            }
        }
        isRecording = false;
        const btn = document.getElementById('btn-start-record');
        if (btn) btn.classList.remove('recording');
    }

    function goToStep(stepId) {
        stopSpeechRecognition();
        document.querySelectorAll('.step-page').forEach(page => page.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function setGameMode(mode) {
        currentConfig.mode = mode;
        ['shadow', 'blocks'].forEach(m => {
            const btn = document.getElementById(`btn-mode-${m}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-mode-${mode}`).classList.add('selected');
        checkCacheStatus();
    }

    function selectCategory(category) {
        currentConfig.category = category;
        ['korean', 'japanese', 'english'].forEach(c => {
            const btn = document.getElementById(`btn-cat-${c}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-cat-${category}`).classList.add('selected');
        
        if (recognition) {
            const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
            recognition.lang = langMap[category] || 'ko-KR';
        }
        
        checkCacheStatus();
    }

    function setUserLang(lang) {
        currentConfig.lang = lang;
        ['zh', 'en', 'kr', 'ja'].forEach(l => {
            const btn = document.getElementById(`btn-lang-${l}`);
            if (btn) btn.classList.remove('selected');
        });
        const activeBtn = document.getElementById(`btn-lang-${lang}`);
        if (activeBtn) activeBtn.classList.add('selected');
    }

    function checkCacheStatus() {
        const cacheKey = `${currentConfig.mode}_data_${currentConfig.category}`;
        const cached = localStorage.getItem(cacheKey);
        const statusDiv = document.getElementById('cache-status');

        if (cached) {
            statusDiv.innerText = "⚡ 已備有本機快取（若試算表有更新請按連線更新）";
            statusDiv.style.color = "#10b981";
        } else {
            statusDiv.innerText = "☁️ 首次載入需連線同步（約 1~2 秒）";
            statusDiv.style.color = "#6b7280";
        }
    }

    async function forceClearAndSync() {
        const cacheKey = `${currentConfig.mode}_data_${currentConfig.category}`;
        const grammarCacheKey = `grammar_data_${currentConfig.category}`;
        localStorage.removeItem(cacheKey);
        localStorage.removeItem(grammarCacheKey);
        alert(`已清除快取，準備抓取最新試算表資料！`);
        confirmLangSetting();
    }

    function loadDataViaJSONP(apiUrl, actionName) {
        return new Promise((resolve, reject) => {
            const callbackName = 'gas_cb_' + Date.now();
            const script = document.createElement('script');

            window[callbackName] = function(data) {
                delete window[callbackName];
                if (document.body.contains(script)) {
                    document.body.removeChild(script);
                }
                resolve(data);
            };

            script.onerror = function() {
                delete window[callbackName];
                if (document.body.contains(script)) {
                    document.body.removeChild(script);
                }
                reject(new Error("JSONP 連線失敗"));
            };

            const connector = apiUrl.includes('?') ? '&' : '?';
            script.src = `${apiUrl}${connector}action=${actionName}&prefix=${callbackName}&t=${Date.now()}`;
            document.body.appendChild(script);
        });
    }

    async function confirmLangSetting() {
        const targetApi = API_URLS[currentConfig.category];
        const langName = currentConfig.category === 'korean' ? '韓文' : (currentConfig.category === 'japanese' ? '日文' : '英文');

        if (!targetApi) {
            alert(`該語言 (${langName}) 的 API 網址尚未設定！`);
            return;
        }

        const cacheKey = `${currentConfig.mode}_data_${currentConfig.category}`;
        const grammarCacheKey = `grammar_data_${currentConfig.category}`;

        const cachedData = localStorage.getItem(cacheKey);
        const cachedGrammar = localStorage.getItem(grammarCacheKey);

        if (cachedData) {
            try {
                const parsed = JSON.parse(cachedData);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    globalCategoryData = parsed;
                    if (cachedGrammar) try { globalGrammarData = JSON.parse(cachedGrammar); } catch(e) {}
                    renderLevelMenu();
                    goToStep('step-level');
                    return;
                }
            } catch(e) {}
        }

        const btnConfirm = document.getElementById('btn-confirm-lang');
        btnConfirm.disabled = true;
        btnConfirm.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 同步最新試算表中...`;

        const actionName = currentConfig.mode === 'blocks' ? 'getBlocksData' : 'getLanguageData';

        try {
            const data = await loadDataViaJSONP(targetApi, actionName);
            if (data && data.status === 'success') {
                globalCategoryData = data.data;
                try { localStorage.setItem(cacheKey, JSON.stringify(data.data)); } catch(err) {}

                try {
                    const grammarRes = await loadDataViaJSONP(targetApi, 'getGrammarData');
                    if (grammarRes && grammarRes.status === 'success') {
                        globalGrammarData = grammarRes.data;
                        try { localStorage.setItem(grammarCacheKey, JSON.stringify(grammarRes.data)); } catch(err) {}
                    }
                } catch(gErr) {}

                renderLevelMenu();
                goToStep('step-level');
            } else {
                alert(`資料讀取失敗：${data ? data.message : '無回應'}`);
            }
        } catch(jsonpErr) {
            alert(`無法連線至 ${langName} API！\n請確認 ${langName} Google Apps Script 已部署為「所有人 (Anyone)」！`);
        } finally {
            btnConfirm.disabled = false;
            btnConfirm.innerHTML = `<i class="fa-solid fa-check"></i> 確定並進入`;
        }
    }

    function renderLevelMenu() {
        const container = document.getElementById('container-levels');
        container.innerHTML = "";

        if (currentConfig.category === 'japanese') {
            const jpLevels = [
                { code: 'beginner', title: '初心者' },
                { code: 'N5', title: 'N5初級' },
                { code: 'N4', title: 'N4初級' },
                { code: 'N3', title: 'N3中級' },
                { code: 'N2', title: 'N2高級' },
                { code: 'N1', title: 'N1高級' }
            ];

            jpLevels.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `${item.title}`;
                btn.onclick = () => selectLevel(item.code, item.title);
                container.appendChild(btn);
            });
        } else {
            const krLevels = [
                { code: '0A', title: '0A 認識字母' },
                { code: '1A', title: '1A 基礎級' },
                { code: '1B', title: '1B 初級' },
                { code: '2A', title: '2A 中初級' },
                { code: '2B', title: '2B 中級' },
                { code: '3A', title: '3A 中高級' },
                { code: '3B', title: '3B 高級' },
                { code: '4A', title: '4A 精通級' },
                { code: 'JLPT/TOPIK', title: '檢定課程' }
            ];

            krLevels.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `${item.title}`;
                btn.onclick = () => selectLevel(item.code, item.title);
                container.appendChild(btn);
            });
        }
    }

    function selectLevel(levelCode, levelTitle) {
        currentConfig.level = levelCode;
        document.getElementById('lbl-unit-level').innerText = levelTitle;
        renderUnits(levelCode);
        goToStep('step-unit');
    }

    function renderUnits(level) {
        const container = document.getElementById('container-units');
        container.innerHTML = "";

        const filtered = globalCategoryData.filter(i => String(i[1]).trim().toUpperCase() === level.trim().toUpperCase());
        const units = [...new Set(filtered.map(i => i[2]))].filter(Boolean).sort((a,b) => a - b);

        if (units.length > 0) {
            units.forEach(u => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `第 ${u} 單元`;
                btn.onclick = () => selectUnit(u);
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = `<div style="color: #6b7280; grid-column: span 3; padding: 20px 0;">此程度 (${level}) 尚無資料</div>`;
        }
    }

    function selectUnit(unitId) {
        currentConfig.unit_id = unitId;
        document.getElementById('lbl-stage-unit').innerText = `Level ${currentConfig.level} | 第 ${unitId} 單元`;

        const container = document.getElementById('container-stages');
        container.innerHTML = "";

        const filtered = globalCategoryData.filter(i => 
            String(i[1]).trim().toUpperCase() === currentConfig.level.trim().toUpperCase() && 
            String(i[2]) === String(unitId)
        );
        const stages = [...new Set(filtered.map(i => i[3]))].filter(Boolean).sort((a,b) => a - b);

        if (stages.length > 0) {
            stages.forEach(s => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `第 ${s} 關`;
                btn.onclick = () => selectStage(s);
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = `<div style="color: #6b7280; grid-column: span 3; padding: 20px 0;">此單元尚無資料</div>`;
        }

        goToStep('step-stage');
    }

    function selectStage(stage) {
        currentConfig.stage = stage;

        const matchGrammar = globalGrammarData.find(g => 
            String(g.level).trim().toUpperCase() === currentConfig.level.trim().toUpperCase() &&
            String(g.unit_id) === String(currentConfig.unit_id) &&
            String(g.stage) === String(stage)
        );

        if (matchGrammar && (
            (matchGrammar.dialogs && matchGrammar.dialogs.length > 0) || 
            (matchGrammar.example && matchGrammar.example.trim() !== '') ||
            (matchGrammar.ready && matchGrammar.ready.trim() !== '') ||
            (matchGrammar.question && matchGrammar.question.trim() !== '')
        )) {
            startGrammarChallenge(matchGrammar);
        } else {
            startMainQuiz();
        }
    }

    function startGrammarChallenge(grammarData) {
        currentGrammarItem = grammarData;
        currentDialogIndex = 0;
        
        document.getElementById('lbl-grammar-info').innerText = `語法教室 | Level ${currentConfig.level} - Unit ${currentConfig.unit_id} - Stage ${currentConfig.stage}`;
        document.getElementById('area-grammar-all-history').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'none';
        document.getElementById('area-grammar-ready').style.display = 'none';
        document.getElementById('area-grammar-quiz').style.display = 'none';

        if (grammarData.dialogs && grammarData.dialogs.length > 0) {
            document.getElementById('area-grammar-dialog').style.display = 'block';
            showCurrentGrammarDialog();
        } else if (grammarData.example && grammarData.example.trim() !== '') {
            showExampleArea();
        } else if (grammarData.ready && grammarData.ready.trim() !== '') {
            showReadyArea();
        } else {
            showGrammarQuizArea();
        }

        goToStep('step-grammar');
    }

    function showCurrentGrammarDialog() {
        if (!currentGrammarItem || !currentGrammarItem.dialogs) return;

        const total = currentGrammarItem.dialogs.length;
        document.getElementById('lbl-dialog-counter').innerText = `${currentDialogIndex + 1} / ${total}`;

        document.getElementById('btn-prev-dialog').disabled = currentDialogIndex === 0;

        const nextBtn = document.getElementById('btn-next-dialog');
        if (currentDialogIndex === total - 1) {
            if (currentGrammarItem.example && currentGrammarItem.example.trim() !== '') {
                nextBtn.innerHTML = `看例句 <i class="fa-solid fa-arrow-right"></i>`;
            } else if (currentGrammarItem.ready && currentGrammarItem.ready.trim() !== '') {
                nextBtn.innerHTML = `準備測驗 <i class="fa-solid fa-arrow-right"></i>`;
            } else if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
                nextBtn.innerHTML = `進入測驗 <i class="fa-solid fa-pen-to-square"></i>`;
            } else {
                nextBtn.innerHTML = `開始練習 <i class="fa-solid fa-play"></i>`;
            }
        } else {
            nextBtn.innerHTML = `下一步 <i class="fa-solid fa-arrow-right"></i>`;
        }

        currentFullDialogText = currentGrammarItem.dialogs[currentDialogIndex];
        startTypewriter(currentFullDialogText);
    }

    function startTypewriter(text) {
        if (typewriterTimer) clearInterval(typewriterTimer);
        const box = document.getElementById('lbl-grammar-dialog');
        box.innerText = "";
        isTypewriterTyping = true;
        
        let charIndex = 0;
        typewriterTimer = setInterval(() => {
            if (charIndex < text.length) {
                box.innerText += text.charAt(charIndex);
                charIndex++;
            } else {
                clearInterval(typewriterTimer);
                isTypewriterTyping = false;
            }
        }, 35);
    }

    function completeTypewriterImmediately() {
        if (isTypewriterTyping) {
            clearInterval(typewriterTimer);
            document.getElementById('lbl-grammar-dialog').innerText = currentFullDialogText;
            isTypewriterTyping = false;
        }
    }

    function nextGrammarDialog() {
        if (isTypewriterTyping) {
            completeTypewriterImmediately();
            return;
        }

        if (!currentGrammarItem) return;

        if (currentGrammarItem.dialogs && currentDialogIndex < currentGrammarItem.dialogs.length - 1) {
            currentDialogIndex++;
            showCurrentGrammarDialog();
        } else {
            processAfterDialogs();
        }
    }

    function prevGrammarDialog() {
        if (isTypewriterTyping) completeTypewriterImmediately();

        if (currentDialogIndex > 0) {
            currentDialogIndex--;
            showCurrentGrammarDialog();
        }
    }

    function skipGrammarDialog() {
        if (typewriterTimer) clearInterval(typewriterTimer);
        isTypewriterTyping = false;
        processAfterDialogs();
    }

    function processAfterDialogs() {
        renderGrammarHistoryList();
        document.getElementById('area-grammar-dialog').style.display = 'none';

        if (currentGrammarItem.example && currentGrammarItem.example.trim() !== '') {
            showExampleArea();
        } else if (currentGrammarItem.ready && currentGrammarItem.ready.trim() !== '') {
            showReadyArea();
        } else if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
            showGrammarQuizArea();
        } else {
            startMainQuiz();
        }
    }

    function showExampleArea() {
        document.getElementById('area-grammar-dialog').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'block';

        const container = document.getElementById('container-example-list');
        container.innerHTML = '';

        const examples = currentGrammarItem.example.split('/').map(s => s.trim()).filter(Boolean);
        const audioUrls = (currentGrammarItem.example_audio || '').split('/').map(s => s.trim());

        examples.forEach((exText, idx) => {
            const row = document.createElement('div');
            row.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: #f3f4f6; padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; font-size: 1.1rem; font-weight: bold;";
            
            const textSpan = document.createElement('span');
            textSpan.innerText = `${idx + 1}. ${exText}`;

            const playBtn = document.createElement('button');
            playBtn.className = 'btn-play-inline';
            playBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i> 播放`;
            
            const audioUrl = audioUrls[idx] || '';
            playBtn.onclick = () => {
                if (audioUrl) {
                    new Audio(audioUrl).play().catch(() => speakTTS(exText));
                } else {
                    speakTTS(exText);
                }
            };

            row.appendChild(textSpan);
            row.appendChild(playBtn);
            container.appendChild(row);
        });
    }

    function goToReadyPage() {
        document.getElementById('area-grammar-example').style.display = 'none';
        if (currentGrammarItem.ready && currentGrammarItem.ready.trim() !== '') {
            showReadyArea();
        } else if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
            showGrammarQuizArea();
        } else {
            startMainQuiz();
        }
    }

    function showReadyArea() {
        document.getElementById('area-grammar-dialog').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'none';
        document.getElementById('area-grammar-ready').style.display = 'block';

        document.getElementById('lbl-ready-text').innerText = currentGrammarItem.ready || "準備好進行測驗了嗎？";
    }

    function enterGrammarQuizFromReady() {
        document.getElementById('area-grammar-ready').style.display = 'none';
        if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
            showGrammarQuizArea();
        } else {
            startMainQuiz();
        }
    }

    function renderGrammarHistoryList() {
        const container = document.getElementById('container-dialog-history');
        container.innerHTML = "";

        if (currentGrammarItem && currentGrammarItem.dialogs && currentGrammarItem.dialogs.length > 0) {
            currentGrammarItem.dialogs.forEach((dText, idx) => {
                const item = document.createElement('div');
                item.className = 'dialog-history-item';
                item.innerHTML = `<span class="num">${idx + 1}.</span> ${dText}`;
                container.appendChild(item);
            });
            document.getElementById('area-grammar-all-history').style.display = 'block';
        }
    }

    function showGrammarQuizArea() {
        document.getElementById('area-grammar-dialog').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'none';
        document.getElementById('area-grammar-ready').style.display = 'none';
        document.getElementById('area-grammar-quiz').style.display = 'block';
        document.getElementById('box-grammar-result').style.display = 'none';

        renderGrammarHistoryList();

        const rawQuestions = currentGrammarItem.question.split('/').map(s => s.trim()).filter(Boolean);
        userGrammarAnswers = new Array(rawQuestions.length).fill('');
        activeBlankIndex = 0;

        const qContainer = document.getElementById('container-grammar-questions');
        qContainer.innerHTML = '';

        rawQuestions.forEach((qStr, idx) => {
            const div = document.createElement('div');
            div.className = 'grammar-q-item';
            
            const formattedText = qStr.replace(/__/g, `<span class="blank-slot" id="blank-slot-${idx}" onclick="setActiveBlank(${idx})">___</span>`);
            div.innerHTML = `${idx + 1}. ${formattedText}`;
            qContainer.appendChild(div);
        });

        const cContainer = document.getElementById('container-grammar-choices');
        cContainer.innerHTML = '';

        const choices = currentGrammarItem.choice.split('/').map(s => s.trim()).filter(Boolean);
        choices.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'block-chip';
            btn.innerText = opt;
            btn.onclick = () => fillGrammarAnswer(opt);
            cContainer.appendChild(btn);
        });
    }

    function setActiveBlank(index) {
        activeBlankIndex = index;
    }

    function fillGrammarAnswer(optionText) {
        userGrammarAnswers[activeBlankIndex] = optionText;
        const slot = document.getElementById(`blank-slot-${activeBlankIndex}`);
        if (slot) {
            slot.innerText = optionText;
        }

        const nextBlank = userGrammarAnswers.findIndex(a => a === '');
        if (nextBlank !== -1) {
            activeBlankIndex = nextBlank;
        }
    }

    function checkGrammarQuiz() {
        const rawQuestions = currentGrammarItem.question.split('/').map(s => s.trim()).filter(Boolean);
        const correctAnswers = currentGrammarItem.answer.split('/').map(s => s.trim().replace(/\s+/g, ''));

        let isAllCorrect = true;

        if (userGrammarAnswers.includes('')) {
            alert('請填寫完所有空格後再送出！');
            return;
        }

        rawQuestions.forEach((qStr, idx) => {
            const builtSentence = qStr.replace(/__/g, userGrammarAnswers[idx]).replace(/\s+/g, '');
            const targetSentence = correctAnswers[idx];

            if (builtSentence !== targetSentence) {
                isAllCorrect = false;
            }
        });

        const resultBox = document.getElementById('box-grammar-result');
        const resultText = document.getElementById('lbl-grammar-result-text');
        const actionBtn = document.getElementById('btn-grammar-action');

        resultBox.style.display = 'block';

        if (isAllCorrect) {
            resultText.innerText = currentGrammarItem.correct || "🎉 完全正確！太棒了！";
            resultText.style.color = "#58cc02";
            actionBtn.innerHTML = `<i class="fa-solid fa-play"></i> 進入挑戰`;
            actionBtn.style.background = "#58cc02";
            actionBtn.onclick = () => startMainQuiz();
        } else {
            resultText.innerText = currentGrammarItem.incorrect || "❌ 答案不太對喔，再試一次！";
            resultText.style.color = "#ff4b4b";
            actionBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> 再來一次`;
            actionBtn.style.background = "#ff4b4b";
            actionBtn.onclick = () => showGrammarQuizArea();
        }
    }

    function startMainQuiz() {
        stopSpeechRecognition();

        const catMap = { 'korean': '韓文', 'japanese': '日文', 'english': '英文' };
        const infoText = `${catMap[currentConfig.category] || currentConfig.category} | Level ${currentConfig.level} | 單元 ${currentConfig.unit_id} | 第 ${currentConfig.stage} 關`;
        document.querySelectorAll('.lbl-quiz-info').forEach(e => e.innerText = infoText);

        const langIndexMap = { 'zh': 5, 'en': 6, 'kr': 7, 'ja': 7 };
        const langIdx = langIndexMap[currentConfig.lang] !== undefined ? langIndexMap[currentConfig.lang] : 5;

        if (currentConfig.mode === 'shadow') {
            goToStep('step-quiz-shadow');

            questions = globalCategoryData.filter(i => 
                String(i[1]).trim().toUpperCase() === currentConfig.level.trim().toUpperCase() &&
                String(i[2]) === String(currentConfig.unit_id) &&
                String(i[3]) === String(currentConfig.stage)
            ).map(i => ({
                id: i[0],
                text: i[4],
                translation: i[langIdx] || i[5] || '',
                audioUrl: i[8],
                hint: i[9] || ''
            }));
        } else {
            goToStep('step-quiz-blocks');
            
            const blockLangIndexMap = { 'zh': 6, 'en': 7, 'kr': 8, 'ja': 8 };
            const bLangIdx = blockLangIndexMap[currentConfig.lang] !== undefined ? blockLangIndexMap[currentConfig.lang] : 6;

            questions = globalCategoryData.filter(i => 
                String(i[1]).trim().toUpperCase() === currentConfig.level.trim().toUpperCase() &&
                String(i[2]) === String(currentConfig.unit_id) &&
                String(i[3]) === String(currentConfig.stage)
            ).map(i => {
                let rawOptions = (i[5] || '').split(',').map(s => s.trim()).filter(Boolean);
                let shuffled = [...rawOptions].sort(() => Math.random() - 0.5);

                return {
                    id: i[0],
                    fullText: i[4],
                    options: shuffled,
                    translation: i[bLangIdx] || i[6] || '',
                    audioUrl: i[9] || ''
                };
            });
        }

        currentIndex = 0;
        if (questions.length > 0) {
            displayQuestion();
        } else {
            alert("該關卡尚無練習題目！");
        }
    }

    function displayQuestion() {
        stopSpeechRecognition();

        if (!questions || questions.length === 0) return;
        const q = questions[currentIndex];

        document.querySelectorAll('.lbl-progress').forEach(e => e.innerText = `${currentIndex + 1} / ${questions.length}`);
        
        if (currentConfig.mode === 'shadow') {
            document.getElementById('lbl-target-text').innerText = q.text || "";
            document.getElementById('lbl-translation').innerText = q.translation || "";
            const hintElem = document.getElementById('lbl-hint');
            if (q.hint && q.hint.trim() !== '') {
                hintElem.innerText = `💡 提示：${q.hint.trim()}`;
                hintElem.style.display = "inline-block";
            } else {
                hintElem.style.display = "none";
            }
            document.getElementById('lbl-recognized-text').innerText = "-";
            document.getElementById('lbl-score').innerText = "得分：--";
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
        } else {
            document.getElementById('lbl-block-translation').innerText = q.translation || "";
            document.getElementById('lbl-block-score').innerText = "請選取字塊組合句子";
            document.getElementById('lbl-block-score').style.color = "#58cc02";
            document.getElementById('btn-block-prev').disabled = currentIndex === 0;
            document.getElementById('btn-block-next').disabled = currentIndex === questions.length - 1;

            selectedBlockIndices = [];
            renderBlocks();
            playBlockAudio();
        }
    }

    function renderBlocks() {
        const q = questions[currentIndex];
        const zoneOptions = document.getElementById('zone-options');
        const zoneAnswer = document.getElementById('zone-answer');

        zoneOptions.innerHTML = "";
        zoneAnswer.innerHTML = "";

        q.options.forEach((optText, idx) => {
            const btn = document.createElement('div');
            btn.className = 'block-chip';
            if (selectedBlockIndices.includes(idx)) {
                btn.classList.add('used');
            }
            btn.innerText = optText;
            btn.onclick = () => selectBlock(idx);
            zoneOptions.appendChild(btn);
        });

        selectedBlockIndices.forEach(idx => {
            const btn = document.createElement('div');
            btn.className = 'block-chip';
            btn.innerText = q.options[idx];
            btn.onclick = () => deselectBlock(idx);
            zoneAnswer.appendChild(btn);
        });
    }

    function selectBlock(idx) {
        selectedBlockIndices.push(idx);
        renderBlocks();
    }

    function deselectBlock(idx) {
        selectedBlockIndices = selectedBlockIndices.filter(i => i !== idx);
        renderBlocks();
    }

    function checkBlockAnswer() {
        const q = questions[currentIndex];
        const userSentence = selectedBlockIndices.map(i => q.options[i]).join('');
        const targetSentence = q.fullText.replace(/\s+/g, '');

        const scoreBadge = document.getElementById('lbl-block-score');

        if (userSentence === targetSentence) {
            scoreBadge.innerText = "🎉 完全正確！太棒了！";
            scoreBadge.style.color = "#58cc02";
            playBlockAudio();
        } else {
            scoreBadge.innerText = "❌ 答案不太對喔，再試試看！";
            scoreBadge.style.color = "#ff4b4b";
        }
    }

    function playBlockAudio() {
        const q = questions[currentIndex];
        if (!q) return;
        if (q.audioUrl && q.audioUrl.trim() !== '') {
            new Audio(q.audioUrl).play().catch(() => speakTTS(q.fullText));
        } else {
            speakTTS(q.fullText);
        }
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            displayQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            displayQuestion();
        }
    }

    function playAudio() {
        if (!questions[currentIndex]) return;
        const q = questions[currentIndex];
        if (q.audioUrl && q.audioUrl.trim() !== "") {
            new Audio(q.audioUrl).play().catch(() => speakTTS(q.text));
        } else {
            speakTTS(q.text);
        }
    }

    function speakTTS(text) {
        if (!text) return;
        const synth = window.speechSynthesis;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        utterance.lang = langMap[currentConfig.category] || 'ko-KR';
        synth.speak(utterance);
    }

    function calculateSimilarity(str1, str2) {
        const s1 = str1.replace(/\s+/g, '').toLowerCase();
        const s2 = str2.replace(/\s+/g, '').toLowerCase();
        if (s1 === s2) return 100;
        
        let track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
        for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
        for (let j = 1; j <= s2.length; j += 1) track[j][0] = j;

        for (let j = 1; j <= s2.length; j += 1) {
            for (let i = 1; i <= s1.length; i += 1) {
                const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        
        const distance = track[s2.length][s1.length];
        const maxLength = Math.max(s1.length, s2.length);
        const score = Math.round((1 - distance / maxLength) * 100);
        return score < 0 ? 0 : score;
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("您的瀏覽器不支援語音辨識功能，請使用 Chrome 瀏覽器。");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        recognition.lang = langMap[currentConfig.category] || 'ko-KR';

        recognition.onstart = () => {
            isRecording = true;
            const btn = document.getElementById('btn-start-record');
            if (btn) btn.classList.add('recording');
        };

        recognition.onend = () => {
            isRecording = false;
            const btn = document.getElementById('btn-start-record');
            if (btn) btn.classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript;
            document.getElementById('lbl-recognized-text').innerText = userSpeech;
            
            const currentQ = questions[currentIndex];
            const targetText = currentQ ? (currentQ.text || "") : "";
            const score = calculateSimilarity(targetText, userSpeech);
            document.getElementById('lbl-score').innerText = `得分：${score}分`;
        };

        recognition.onerror = (e) => {
            isRecording = false;
            const btn = document.getElementById('btn-start-record');
            if (btn) btn.classList.remove('recording');
        };
    }

    function toggleRecording() {
        if (!recognition) {
            initSpeechRecognition();
        }

        if (isRecording) {
            stopSpeechRecognition();
        } else {
            try {
                const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
                recognition.lang = langMap[currentConfig.category] || 'ko-KR';
                recognition.start();
            } catch(e) {
                stopSpeechRecognition();
                setTimeout(() => {
                    try { recognition.start(); } catch(err){}
                }, 200);
            }
        }
    }

    document.getElementById('btn-play-audio').addEventListener('click', playAudio);
    document.getElementById('btn-start-record').addEventListener('click', toggleRecording);

    window.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopSpeechRecognition();
        }
    });

    window.addEventListener('pagehide', () => {
        stopSpeechRecognition();
    });

    window.onload = () => {
        initSpeechRecognition();
        selectCategory('korean');
        setUserLang('zh');
        setGameMode('shadow');
    };
</script>

</body>
