<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種跟讀關卡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-blue: #1cb0f6;
            --duo-red: #ff4b4b;
            --duo-gray: #e5e7eb;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .shadowing-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .level-selector-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #f3f4f6;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: left;
        }

        .selector-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .selector-item label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #4b5563;
        }

        .selector-item select {
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            background: white;
            font-weight: bold;
            color: #1f2937;
        }

        .lang-setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .target-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1f2937;
            margin: 15px 0 5px 0;
            min-height: 2.5rem;
        }

        .translation-text {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 25px;
            min-height: 1.5rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-listen { background: var(--duo-blue); box-shadow: 0 4px 0 #1899d6; }
        .btn-record { background: var(--duo-red); box-shadow: 0 4px 0 #ea2b2b; }
        .btn-record.recording { animation: pulse 1s infinite; background: #dc2626; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .score-badge {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--duo-green);
            margin-top: 5px;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn-nav {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #374151;
            transition: background 0.2s;
        }

        .btn-nav:hover:not(:disabled) { background: #e5e7eb; }
        .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="shadowing-card">

    <!-- 關卡選擇區塊 (Level, Unit, Stage) -->
    <div class="level-selector-box">
        <div class="selector-item">
            <label>程度 (Level)</label>
            <select id="select-level">
                <option value="0A" selected>0A</option>
                <option value="0B">0B</option>
                <option value="1A">1A</option>
                <option value="1B">1B</option>
                <option value="2A">2A</option>
                <option value="2B">2B</option>
                <option value="3A">3A</option>
                <option value="3B">3B</option>
                <option value="4A">4A</option>
                <option value="4B">4B</option>
            </select>
        </div>
        <div class="selector-item">
            <label>單元 (Unit)</label>
            <select id="select-unit">
                <option value="1" selected>第 1 單元</option>
                <option value="2">第 2 單元</option>
                <option value="3">第 3 單元</option>
                <option value="4">第 4 單元</option>
                <option value="5">第 5 單元</option>
            </select>
        </div>
        <div class="selector-item">
            <label>關卡 (Stage)</label>
            <select id="select-stage">
                <option value="1" selected>第 1 關</option>
                <option value="2">第 2 關</option>
                <option value="3">第 3 關</option>
            </select>
        </div>
    </div>

    <!-- 母語設定選單 -->
    <div class="lang-setting">
        <span><i class="fa-solid fa-language"></i> 母語翻譯：</span>
        <select id="select-user-lang">
            <option value="zh" selected>繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <hr style="border: 0; border-top: 1px solid #f3f4f6;">

    <!-- 題目區域 -->
    <div id="quiz-container">
        <div class="target-text" id="lbl-target-text">載入中...</div>
        <div class="translation-text" id="lbl-translation">...</div>

        <!-- 按鈕區 -->
        <div class="controls">
            <button class="btn-circle btn-listen" id="btn-play-audio" title="聽示範音">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="btn-circle btn-record" id="btn-start-record" title="開始跟讀">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <!-- 比對結果區 -->
        <div class="result-box">
            <div>辨識結果：<span id="lbl-recognized-text" style="font-weight: bold; color: #374151;">-</span></div>
            <div class="score-badge" id="lbl-score">得分：--</div>
        </div>

        <!-- 導覽切換按鈕 -->
        <div class="nav-controls">
            <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">上一題</button>
            <span id="lbl-progress" style="color: #6b7280; font-size: 0.9rem;">0 / 0</span>
            <button class="btn-nav" id="btn-next" onclick="nextQuestion()">下一題</button>
        </div>

        <div id="debug-info" class="error-msg"></div>
    </div>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxNtJt1URgct9-T_yzXowKGvHeM5l17NiwviOs8ySwIbrdWD6zfctdCCx7YpMu3P7zG/exec";

    let currentConfig = {
        category: 'korean',
        level: '0A',
        unit_id: '1',
        stage: '1',
        lang: 'zh'
    };

    let questions = [];
    let currentIndex = 0;
    let recognition = null;

    // 1. 初始化語音辨識
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("您的瀏覽器不支援語音辨識，建議使用 Chrome 瀏覽器！");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        recognition.lang = langMap[currentConfig.category] || 'ko-KR';

        recognition.onstart = () => {
            document.getElementById('btn-start-record').classList.add('recording');
        };

        recognition.onend = () => {
            document.getElementById('btn-start-record').classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript;
            document.getElementById('lbl-recognized-text').innerText = userSpeech;
            
            const currentQ = questions[currentIndex];
            const targetText = currentQ ? (currentQ.text || "") : "";
            const score = calculateSimilarity(targetText, userSpeech);
            document.getElementById('lbl-score').innerText = `得分：${score}分`;
        };

        recognition.onerror = (event) => {
            console.error("語音辨識錯誤：", event.error);
            document.getElementById('btn-start-record').classList.remove('recording');
        };
    }

    // 2. 從 GAS 後端載入題目
    async function loadQuestions() {
        document.getElementById('lbl-target-text').innerText = "載入題目中...";
        document.getElementById('lbl-translation').innerText = "...";
        document.getElementById('debug-info').innerText = "";
        
        const url = `${GAS_API_URL}?action=getShadowingQuestions&category=${encodeURIComponent(currentConfig.category)}&level=${encodeURIComponent(currentConfig.level)}&unit_id=${encodeURIComponent(currentConfig.unit_id)}&stage=${encodeURIComponent(currentConfig.stage)}&lang=${encodeURIComponent(currentConfig.lang)}`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            if (data.status === 'success' && data.data && data.data.length > 0) {
                questions = data.data;
                currentIndex = 0;
                displayQuestion();
            } else {
                questions = [];
                document.getElementById('lbl-target-text').innerText = "無相關題目";
                document.getElementById('lbl-translation').innerText = "";
                document.getElementById('lbl-progress').innerText = "0 / 0";
                document.getElementById('btn-prev').disabled = true;
                document.getElementById('btn-next').disabled = true;
                document.getElementById('debug-info').innerText = `查無資料，請確認此關卡是否有資料：Level=${currentConfig.level}, Unit=${currentConfig.unit_id}, Stage=${currentConfig.stage}`;
            }
        } catch (err) {
            console.error("載入失敗：", err);
            document.getElementById('lbl-target-text').innerText = "載入失敗";
            document.getElementById('debug-info').innerText = "無法連線至 API，請檢查網路狀態。";
        }
    }

    // 3. 顯示當前題目
    function displayQuestion() {
        if (!questions || questions.length === 0) return;

        const q = questions[currentIndex];
        document.getElementById('lbl-target-text').innerText = q.text || "無題目文字";
        document.getElementById('lbl-translation').innerText = q.translation || "";
        document.getElementById('lbl-recognized-text').innerText = "-";
        document.getElementById('lbl-score').innerText = "得分：--";

        document.getElementById('lbl-progress').innerText = `${currentIndex + 1} / ${questions.length}`;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
    }

    // 4. 切換題目
    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            displayQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            displayQuestion();
        }
    }

    // 5. 播放語音
    function playAudio() {
        if (!questions[currentIndex]) return;
        const q = questions[currentIndex];

        if (q.audioUrl && q.audioUrl.trim() !== "") {
            const audio = new Audio(q.audioUrl);
            audio.play().catch(e => speakTTS(q.text));
        } else {
            speakTTS(q.text);
        }
    }

    function speakTTS(text) {
        if (!text) return;
        const synth = window.speechSynthesis;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        utterance.lang = langMap[currentConfig.category] || 'ko-KR';
        synth.speak(utterance);
    }

    // 6. 字串相似度計算
    function calculateSimilarity(str1, str2) {
        const s1 = str1.replace(/\s+/g, '').toLowerCase();
        const s2 = str2.replace(/\s+/g, '').toLowerCase();
        if (s1 === s2) return 100;
        
        let track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
        for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;

        for (let j = 1; j <= s2.length; j += 1) {
            for (let i = 1; i <= s1.length; i += 1) {
                const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        
        const distance = track[s2.length][s1.length];
        const maxLength = Math.max(s1.length, s2.length);
        const score = Math.round((1 - distance / maxLength) * 100);
        return score < 0 ? 0 : score;
    }

    // 事件監聽與關卡連動
    document.getElementById('select-level').addEventListener('change', (e) => {
        currentConfig.level = e.target.value;
        loadQuestions();
    });

    document.getElementById('select-unit').addEventListener('change', (e) => {
        currentConfig.unit_id = e.target.value;
        loadQuestions();
    });

    document.getElementById('select-stage').addEventListener('change', (e) => {
        currentConfig.stage = e.target.value;
        loadQuestions();
    });

    document.getElementById('select-user-lang').addEventListener('change', (e) => {
        currentConfig.lang = e.target.value;
        loadQuestions();
    });

    document.getElementById('btn-play-audio').addEventListener('click', playAudio);
    document.getElementById('btn-start-record').addEventListener('click', () => {
        if (recognition) {
            try { recognition.start(); } catch(e) {}
        }
    });

    window.onload = () => {
        initSpeechRecognition();
        loadQuestions();
    };
</script>

</body>
</html>
