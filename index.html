<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種跟讀關卡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-blue: #1cb0f6;
            --duo-red: #ff4b4b;
            --duo-gray: #e5e7eb;
            --duo-dark: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .shadowing-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        .step-page {
            display: none;
        }

        .step-page.active {
            display: block;
        }

        h2.step-title {
            color: var(--duo-dark);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .option-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }

        .btn-option {
            background: white;
            border: 2px solid #e5e7eb;
            border-bottom: 4px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px 10px;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--duo-dark);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-option:hover {
            border-color: var(--duo-blue);
            color: var(--duo-blue);
        }

        .btn-option.selected {
            border-color: var(--duo-blue) !important;
            border-bottom-color: #1899d6 !important;
            background-color: #ddf4ff !important;
            color: var(--duo-blue) !important;
        }

        /* 確定按鈕 */
        .btn-confirm {
            width: 100%;
            background: var(--duo-green);
            color: white;
            border: none;
            border-bottom: 4px solid #46a302;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-confirm:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-back-step {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .btn-back-step:hover { color: var(--duo-blue); }

        .target-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1f2937;
            margin: 15px 0 5px 0;
            min-height: 2.5rem;
        }

        .translation-text {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 25px;
            min-height: 1.5rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-listen { background: var(--duo-blue); box-shadow: 0 4px 0 #1899d6; }
        .btn-record { background: var(--duo-red); box-shadow: 0 4px 0 #ea2b2b; }
        .btn-record.recording { animation: pulse 1s infinite; background: #dc2626; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .score-badge {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--duo-green);
            margin-top: 5px;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn-nav {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #374151;
        }

        .btn-nav:hover:not(:disabled) { background: #e5e7eb; }
        .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

        .challenge-header-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn-sub-nav {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            color: #4b5563;
        }

        .btn-sub-nav:hover { background: #e5e7eb; color: var(--duo-blue); }

        .loading-spinner {
            color: var(--duo-blue);
            font-weight: bold;
            padding: 20px;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="shadowing-card">

    <!-- 步驟 1：選擇學習語言與母語 -->
    <div id="step-lang" class="step-page active">
        <h2 class="step-title"><i class="fa-solid fa-earth-americas"></i> 請選擇語言設定</h2>
        
        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">要學習的語言：</p>
        <div class="option-grid grid-3">
            <button class="btn-option" id="btn-cat-korean" onclick="selectCategory('korean')">🇰🇷 韓文</button>
            <button class="btn-option" id="btn-cat-japanese" onclick="selectCategory('japanese')">🇯🇵 日文</button>
            <button class="btn-option" id="btn-cat-english" onclick="selectCategory('english')">🇺🇸 英文</button>
        </div>

        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">你的母語（題目翻譯）：</p>
        <div class="option-grid grid-3">
            <button class="btn-option" id="btn-lang-zh" onclick="setUserLang('zh')">繁體中文</button>
            <button class="btn-option" id="btn-lang-en" onclick="setUserLang('en')">English</button>
            <button class="btn-option" id="btn-lang-ja" onclick="setUserLang('ja')">日本語</button>
        </div>

        <button class="btn-confirm" onclick="confirmLangSetting()"><i class="fa-solid fa-check"></i> 確定</button>
    </div>

    <!-- 步驟 2：選擇程度 (Level) -->
    <div id="step-level" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-lang')"><i class="fa-solid fa-arrow-left"></i> 重選語言</button>
        </div>
        <h2 class="step-title"><i class="fa-solid fa-layer-group"></i> 請選擇程度 (Level)</h2>
        <div class="option-grid grid-2">
            <button class="btn-option" onclick="selectLevel('0A')">0A</button>
            <button class="btn-option" onclick="selectLevel('0B')">0B</button>
            <button class="btn-option" onclick="selectLevel('1A')">1A</button>
            <button class="btn-option" onclick="selectLevel('1B')">1B</button>
            <button class="btn-option" onclick="selectLevel('2A')">2A</button>
            <button class="btn-option" onclick="selectLevel('2B')">2B</button>
            <button class="btn-option" onclick="selectLevel('3A')">3A</button>
            <button class="btn-option" onclick="selectLevel('3B')">3B</button>
            <button class="btn-option" onclick="selectLevel('4A')">4A</button>
            <button class="btn-option" onclick="selectLevel('4B')">4B</button>
        </div>
    </div>

    <!-- 步驟 3：動態單元選擇 (Unit) -->
    <div id="step-unit" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-level')"><i class="fa-solid fa-arrow-left"></i> 回程度選擇</button>
            <span id="lbl-unit-level" style="font-weight: bold; color: var(--duo-blue);">Level: 0A</span>
        </div>
        
        <h2 class="step-title"><i class="fa-solid fa-book-open"></i> 請選擇單元 (Unit)</h2>
        <div id="container-units" class="option-grid grid-3">
            <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> 載入單元中...</div>
        </div>
    </div>

    <!-- 步驟 4：動態關卡選擇 (Stage) -->
    <div id="step-stage" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-unit')"><i class="fa-solid fa-arrow-left"></i> 回單元選擇</button>
            <span id="lbl-stage-unit" style="font-weight: bold; color: var(--duo-blue);">單元 1</span>
        </div>

        <h2 class="step-title"><i class="fa-solid fa-flag-checkered"></i> 請選擇關卡 (Stage)</h2>
        <div id="container-stages" class="option-grid grid-3">
            <div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> 載入關卡中...</div>
        </div>
    </div>

    <!-- 步驟 5：跟讀挑戰畫面 -->
    <div id="step-quiz" class="step-page">
        <div class="challenge-header-btns">
            <button class="btn-sub-nav" onclick="goToStep('step-level')"><i class="fa-solid fa-layer-group"></i> 回程度</button>
            <button class="btn-sub-nav" onclick="goToStep('step-unit')"><i class="fa-solid fa-book-open"></i> 回單元</button>
            <button class="btn-sub-nav" onclick="goToStep('step-stage')"><i class="fa-solid fa-flag-checkered"></i> 回關卡</button>
        </div>

        <div style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px;" id="lbl-quiz-info">
            韓文 | 0A | 單元 1 | 第 1 關
        </div>

        <div class="target-text" id="lbl-target-text">載入中...</div>
        <div class="translation-text" id="lbl-translation">...</div>

        <!-- 按鈕區 -->
        <div class="controls">
            <button class="btn-circle btn-listen" id="btn-play-audio" title="聽示範音">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="btn-circle btn-record" id="btn-start-record" title="開始跟讀">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <!-- 比對結果區 -->
        <div class="result-box">
            <div>辨識結果：<span id="lbl-recognized-text" style="font-weight: bold; color: #374151;">-</span></div>
            <div class="score-badge" id="lbl-score">得分：--</div>
        </div>

        <!-- 導覽切換按鈕 -->
        <div class="nav-controls">
            <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">上一題</button>
            <span id="lbl-progress" style="color: #6b7280; font-size: 0.9rem;">0 / 0</span>
            <button class="btn-nav" id="btn-next" onclick="nextQuestion()">下一題</button>
        </div>

        <div id="debug-info" class="error-msg"></div>
    </div>

</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxNtJt1URgct9-T_yzXowKGvHeM5l17NiwviOs8ySwIbrdWD6zfctdCCx7YpMu3P7zG/exec";

    let currentConfig = {
        category: 'korean',
        level: '0A',
        unit_id: '1',
        stage: '1',
        lang: 'zh'
    };

    let questions = [];
    let currentIndex = 0;
    let recognition = null;

    // 畫面切換控制
    function goToStep(stepId) {
        document.querySelectorAll('.step-page').forEach(page => {
            page.classList.remove('active');
        });
        document.getElementById(stepId).classList.add('active');
    }

    // 選擇語言
    function selectCategory(category) {
        currentConfig.category = category;
        ['korean', 'japanese', 'english'].forEach(c => {
            const btn = document.getElementById(`btn-cat-${c}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-cat-${category}`).classList.add('selected');
    }

    function setUserLang(lang) {
        currentConfig.lang = lang;
        ['zh', 'en', 'ja'].forEach(l => {
            const btn = document.getElementById(`btn-lang-${l}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-lang-${lang}`).classList.add('selected');
    }

    // 點擊「確定」按鈕後進入程度選擇
    function confirmLangSetting() {
        goToStep('step-level');
    }

    // 選擇程度 Level，動態讀取單元 (Unit) 數量
    async function selectLevel(level) {
        currentConfig.level = level;
        document.getElementById('lbl-unit-level').innerText = `Level: ${level}`;
        goToStep('step-unit');

        // 動態抓取此 Level 有哪些 Unit
        const container = document.getElementById('container-units');
        container.innerHTML = `<div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> 查詢單元中...</div>`;

        try {
            const url = `${GAS_API_URL}?action=getStructure&category=${encodeURIComponent(currentConfig.category)}&level=${encodeURIComponent(currentConfig.level)}`;
            const res = await fetch(url);
            const data = await res.json();

            if (data.status === 'success' && data.units && data.units.length > 0) {
                container.innerHTML = "";
                data.units.forEach(u => {
                    const btn = document.createElement('button');
                    btn.className = "btn-option";
                    btn.innerText = `第 ${u} 單元`;
                    btn.onclick = () => selectUnit(u);
                    container.appendChild(btn);
                });
            } else {
                container.innerHTML = `<div style="color: #6b7280; grid-column: span 3;">此程度目前尚無單元資料</div>`;
            }
        } catch(e) {
            container.innerHTML = `<div class="error-msg" style="grid-column: span 3;">讀取失敗，請檢查 API 連線</div>`;
        }
    }

    // 選擇單元 Unit，動態讀取關卡 (Stage) 數量
    async function selectUnit(unitId) {
        currentConfig.unit_id = unitId;
        document.getElementById('lbl-stage-unit').innerText = `Level ${currentConfig.level} | 第 ${unitId} 單元`;
        goToStep('step-stage');

        // 動態抓取此 Unit 有哪些 Stage
        const container = document.getElementById('container-stages');
        container.innerHTML = `<div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> 查詢關卡中...</div>`;

        try {
            const url = `${GAS_API_URL}?action=getStructure&category=${encodeURIComponent(currentConfig.category)}&level=${encodeURIComponent(currentConfig.level)}&unit_id=${encodeURIComponent(currentConfig.unit_id)}`;
            const res = await fetch(url);
            const data = await res.json();

            if (data.status === 'success' && data.stages && data.stages.length > 0) {
                container.innerHTML = "";
                data.stages.forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = "btn-option";
                    btn.innerText = `第 ${s} 關`;
                    btn.onclick = () => selectStage(s);
                    container.appendChild(btn);
                });
            } else {
                container.innerHTML = `<div style="color: #6b7280; grid-column: span 3;">此單元目前尚無關卡資料</div>`;
            }
        } catch(e) {
            container.innerHTML = `<div class="error-msg" style="grid-column: span 3;">讀取失敗，請檢查 API 連線</div>`;
        }
    }

    // 選擇關卡 Stage 並開始挑戰
    function selectStage(stage) {
        currentConfig.stage = stage;
        goToStep('step-quiz');
        
        const catMap = { 'korean': '韓文', 'japanese': '日文', 'english': '英文' };
        document.getElementById('lbl-quiz-info').innerText = `${catMap[currentConfig.category] || currentConfig.category} | Level ${currentConfig.level} | 單元 ${currentConfig.unit_id} | 第 ${currentConfig.stage} 關`;
        
        loadQuestions();
    }

    // 初始化語音辨識
    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        recognition.lang = langMap[currentConfig.category] || 'ko-KR';

        recognition.onstart = () => {
            document.getElementById('btn-start-record').classList.add('recording');
        };

        recognition.onend = () => {
            document.getElementById('btn-start-record').classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript;
            document.getElementById('lbl-recognized-text').innerText = userSpeech;
            
            const currentQ = questions[currentIndex];
            const targetText = currentQ ? (currentQ.text || "") : "";
            const score = calculateSimilarity(targetText, userSpeech);
            document.getElementById('lbl-score').innerText = `得分：${score}分`;
        };

        recognition.onerror = (event) => {
            document.getElementById('btn-start-record').classList.remove('recording');
        };
    }

    // 從 GAS 載入題目
    async function loadQuestions() {
        document.getElementById('lbl-target-text').innerText = "載入題目中...";
        document.getElementById('lbl-translation').innerText = "...";
        document.getElementById('debug-info').innerText = "";
        
        const url = `${GAS_API_URL}?action=getShadowingQuestions&category=${encodeURIComponent(currentConfig.category)}&level=${encodeURIComponent(currentConfig.level)}&unit_id=${encodeURIComponent(currentConfig.unit_id)}&stage=${encodeURIComponent(currentConfig.stage)}&lang=${encodeURIComponent(currentConfig.lang)}`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            if (data.status === 'success' && data.data && data.data.length > 0) {
                questions = data.data;
                currentIndex = 0;
                displayQuestion();
            } else {
                questions = [];
                document.getElementById('lbl-target-text').innerText = "無相關題目";
                document.getElementById('lbl-translation').innerText = "";
                document.getElementById('lbl-progress').innerText = "0 / 0";
                document.getElementById('btn-prev').disabled = true;
                document.getElementById('btn-next').disabled = true;
                document.getElementById('debug-info').innerText = `查無資料，請確認 Sheet 中是否有符合：Level=${currentConfig.level}, Unit=${currentConfig.unit_id}, Stage=${currentConfig.stage} 的資料`;
            }
        } catch (err) {
            document.getElementById('lbl-target-text').innerText = "載入失敗";
            document.getElementById('debug-info').innerText = "無法連線至 API，請檢查網路狀態。";
        }
    }

    // 顯示題目
    function displayQuestion() {
        if (!questions || questions.length === 0) return;

        const q = questions[currentIndex];
        document.getElementById('lbl-target-text').innerText = q.text || "無題目文字";
        document.getElementById('lbl-translation').innerText = q.translation || "";
        document.getElementById('lbl-recognized-text').innerText = "-";
        document.getElementById('lbl-score').innerText = "得分：--";

        document.getElementById('lbl-progress').innerText = `${currentIndex + 1} / ${questions.length}`;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            displayQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            displayQuestion();
        }
    }

    function playAudio() {
        if (!questions[currentIndex]) return;
        const q = questions[currentIndex];

        if (q.audioUrl && q.audioUrl.trim() !== "") {
            const audio = new Audio(q.audioUrl);
            audio.play().catch(e => speakTTS(q.text));
        } else {
            speakTTS(q.text);
        }
    }

    function speakTTS(text) {
        if (!text) return;
        const synth = window.speechSynthesis;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        utterance.lang = langMap[currentConfig.category] || 'ko-KR';
        synth.speak(utterance);
    }

    function calculateSimilarity(str1, str2) {
        const s1 = str1.replace(/\s+/g, '').toLowerCase();
        const s2 = str2.replace(/\s+/g, '').toLowerCase();
        if (s1 === s2) return 100;
        
        let track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
        for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;

        for (let j = 1; j <= s2.length; j += 1) {
            for (let i = 1; i <= s1.length; i += 1) {
                const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        
        const distance = track[s2.length][s1.length];
        const maxLength = Math.max(s1.length, s2.length);
        const score = Math.round((1 - distance / maxLength) * 100);
        return score < 0 ? 0 : score;
    }

    document.getElementById('btn-play-audio').addEventListener('click', playAudio);
    document.getElementById('btn-start-record').addEventListener('click', () => {
        if (recognition) {
            try { recognition.start(); } catch(e) {}
        }
    });

    window.onload = () => {
        initSpeechRecognition();
        
        // 預設選取
        selectCategory('korean');
        setUserLang('zh');
    };
</script>

</body>
</html>
