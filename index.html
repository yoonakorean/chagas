<script>
    const API_URLS = {
        korean: "https://script.google.com/macros/s/AKfycbxNtJt1URgct9-T_yzXowKGvHeM5l17NiwviOs8ySwIbrdWD6zfctdCCx7YpMu3P7zG/exec",
        japanese: "https://script.google.com/macros/s/AKfycbQirnmmcIOXE3aEGSUHlJ62jvB18rLx4N6QXgN8PO53DZJGwGe1lPnNXUjjYZj01gskg/exec",
        english: ""
    };

    let currentConfig = {
        mode: 'shadow',
        category: 'korean',
        level: '',
        unit_id: '1',
        stage: '1',
        lang: 'zh'
    };

    let rawShadowData = [];  
    let rawBlocksData = [];  
    let globalGrammarData = []; 
    let rawDialogueData = []; 
    let rawVocabData = [];

    let questions = [];
    let currentIndex = 0;
    let recognition = null;
    let isRecording = false;
    let isToggling = false; 
    let selectedBlockIndices = [];

    // 對話練習專用狀態
    let currentDialogueItem = null;
    let dialogueList = []; 
    let dialogueIndex = 0;
    let dialogueSubMode = 'basic'; 
    let userRole = 'A'; 
    let isBlindUnlocked = false;

    // 單字練習專用狀態
    let vocabQuestions = [];
    let vocabIndex = 0;

    let currentGrammarItem = null;
    let currentDialogIndex = 0;
    let userGrammarAnswers = [];
    let activeBlankIndex = 0;

    let typewriterTimer = null;
    let isTypewriterTyping = false;
    let currentFullDialogText = "";

    function stopSpeechRecognition() {
        if (recognition) {
            try { 
                recognition.onstart = null;
                recognition.onend = null;
                recognition.onerror = null;
                recognition.onresult = null;
                recognition.abort(); 
            } catch (e) {}
        }
        isRecording = false;
        document.querySelectorAll('.btn-record').forEach(b => b.classList.remove('recording'));
    }

    function goToStep(stepId) {
        stopSpeechRecognition();
        document.querySelectorAll('.step-page').forEach(page => page.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function setUserLang(lang) {
        currentConfig.lang = lang;
        ['zh', 'en', 'kr'].forEach(l => {
            const btn = document.getElementById(`btn-lang-${l}`);
            if (btn) btn.classList.remove('selected');
        });
        const activeBtn = document.getElementById(`btn-lang-${lang}`);
        if (activeBtn) activeBtn.classList.add('selected');
    }

    function selectCategory(category) {
        currentConfig.category = category;
        ['korean', 'japanese', 'english'].forEach(c => {
            const btn = document.getElementById(`btn-cat-${c}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-cat-${category}`).classList.add('selected');
        checkCacheStatus();
    }

    function checkCacheStatus() {
        const cacheKey = `all_data_${currentConfig.category}`;
        const cached = localStorage.getItem(cacheKey);
        const statusDiv = document.getElementById('cache-status');

        if (cached) {
            statusDiv.innerText = "⚡ 已備有本機快取（若試算表有更新請按連線更新）";
            statusDiv.style.color = "#10b981";
        } else {
            statusDiv.innerText = "☁ 首次載入需連線同步（約 1~2 秒）";
            statusDiv.style.color = "#6b7280";
        }
    }

    async function forceClearAndSync() {
        localStorage.removeItem(`all_data_${currentConfig.category}`);
        localStorage.removeItem(`grammar_data_${currentConfig.category}`);
        localStorage.removeItem(`dialogue_data_${currentConfig.category}`);
        localStorage.removeItem(`vocab_data_${currentConfig.category}`);
        
        const langName = currentConfig.category === 'korean' ? '韓文' : (currentConfig.category === 'japanese' ? '日文' : '英文');
        alert(`已清除 ${langName} 的快取！請繼續點擊下一步。`);
        checkCacheStatus();
    }

    function loadDataViaJSONP(apiUrl, actionName) {
        return new Promise((resolve, reject) => {
            const callbackName = 'gas_cb_' + Date.now() + Math.floor(Math.random()*1000);
            const script = document.createElement('script');

            window[callbackName] = function(data) {
                delete window[callbackName];
                if (document.body.contains(script)) {
                    document.body.removeChild(script);
                }
                resolve(data);
            };

            script.onerror = function() {
                delete window[callbackName];
                if (document.body.contains(script)) {
                    document.body.removeChild(script);
                }
                reject(new Error("JSONP 連線失敗"));
            };

            const connector = apiUrl.includes('?') ? '&' : '?';
            script.src = `${apiUrl}${connector}action=${actionName}&prefix=${callbackName}&t=${Date.now()}`;
            document.body.appendChild(script);
        });
    }

    async function confirmLearnLang() {
        const targetApi = API_URLS[currentConfig.category];
        const langName = currentConfig.category === 'korean' ? '韓文' : (currentConfig.category === 'japanese' ? '日文' : '英文');

        if (!targetApi) {
            alert(`該語言 (${langName}) 的 API 網址尚未設定！`);
            return;
        }

        const cacheKey = `all_data_${currentConfig.category}`;
        const grammarCacheKey = `grammar_data_${currentConfig.category}`;
        const dialogueCacheKey = `dialogue_data_${currentConfig.category}`;
        const vocabCacheKey = `vocab_data_${currentConfig.category}`;

        const cachedData = localStorage.getItem(cacheKey);
        const cachedGrammar = localStorage.getItem(grammarCacheKey);
        const cachedDialogue = localStorage.getItem(dialogueCacheKey);
        const cachedVocab = localStorage.getItem(vocabCacheKey);

        if (cachedData) {
            try {
                const parsed = JSON.parse(cachedData);
                if (parsed && (parsed.shadow || parsed.blocks)) {
                    rawShadowData = parsed.shadow || [];
                    rawBlocksData = parsed.blocks || [];
                    if (cachedGrammar) try { globalGrammarData = JSON.parse(cachedGrammar); } catch(e) {}
                    if (cachedDialogue) try { rawDialogueData = JSON.parse(cachedDialogue); } catch(e) {}
                    if (cachedVocab) try { rawVocabData = JSON.parse(cachedVocab); } catch(e) {}
                    renderLevelMenu();
                    goToStep('step-level');
                    return;
                }
            } catch(e) {}
        }

        const btnConfirm = document.getElementById('btn-confirm-learn-lang');
        btnConfirm.disabled = true;
        btnConfirm.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 同步最新試算表中...`;

        try {
            const [shadowRes, blocksRes, grammarRes, dialogueRes, vocabRes] = await Promise.all([
                loadDataViaJSONP(targetApi, 'getLanguageData').catch(()=>null),
                loadDataViaJSONP(targetApi, 'getBlocksData').catch(()=>null),
                loadDataViaJSONP(targetApi, 'getGrammarData').catch(()=>null),
                loadDataViaJSONP(targetApi, 'getDialogueData').catch(()=>null),
                loadDataViaJSONP(targetApi, 'getVocabularyData').catch(()=>null)
            ]);

            if (shadowRes && shadowRes.status === 'success') rawShadowData = shadowRes.data || [];
            if (blocksRes && blocksRes.status === 'success') rawBlocksData = blocksRes.data || [];
            if (grammarRes && grammarRes.status === 'success') {
                globalGrammarData = grammarRes.data || [];
                try { localStorage.setItem(grammarCacheKey, JSON.stringify(grammarRes.data)); } catch(e){}
            }
            if (dialogueRes && dialogueRes.status === 'success') {
                rawDialogueData = dialogueRes.data || [];
                try { localStorage.setItem(dialogueCacheKey, JSON.stringify(dialogueRes.data)); } catch(e){}
            }
            if (vocabRes && vocabRes.status === 'success') {
                rawVocabData = vocabRes.data || [];
                try { localStorage.setItem(vocabCacheKey, JSON.stringify(vocabRes.data)); } catch(e){}
            }

            try {
                localStorage.setItem(cacheKey, JSON.stringify({
                    shadow: rawShadowData,
                    blocks: rawBlocksData
                }));
            } catch(err) {}

            renderLevelMenu();
            goToStep('step-level');

        } catch(jsonpErr) {
            alert(`無法連線至 ${langName} API！\n請確認 API 狀態。`);
        } finally {
            btnConfirm.disabled = false;
            btnConfirm.innerHTML = `<i class="fa-solid fa-arrow-right"></i> 下一步（選擇程度）`;
        }
    }

    function renderLevelMenu() {
        const container = document.getElementById('container-levels');
        container.innerHTML = "";

        if (currentConfig.category === 'japanese') {
            const jpLevels = [
                { code: 'beginner', title: '初心者' },
                { code: 'N5', title: 'N5初級' },
                { code: 'N4', title: 'N4初級' },
                { code: 'N3', title: 'N3中級' },
                { code: 'N2', title: 'N2高級' },
                { code: 'N1', title: 'N1高級' },
                { code: 'JLPT/TOPIK', title: '檢定課程' }
            ];

            jpLevels.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `${item.title}`;
                btn.onclick = () => selectLevel(item.code, item.title);
                container.appendChild(btn);
            });
        } else {
            const krLevels = [
                { code: '0A', title: '0A 認識字母' },
                { code: '1A', title: '1A 基礎級' },
                { code: '1B', title: '1B 初級' },
                { code: '2A', title: '2A 中初級' },
                { code: '2B', title: '2B 中級' },
                { code: '3A', title: '3A 中高級' },
                { code: '3B', title: '3B 高級' },
                { code: '4A', title: '4A 精通級' },
                { code: 'JLPT/TOPIK', title: '檢定課程' }
            ];

            krLevels.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `${item.title}`;
                btn.onclick = () => selectLevel(item.code, item.title);
                container.appendChild(btn);
            });
        }
    }

    function selectLevel(levelCode, levelTitle) {
        currentConfig.level = levelCode;
        document.getElementById('lbl-unit-level').innerText = levelTitle;
        renderUnits(currentConfig.level);
        goToStep('step-unit');
    }

    function normalizeLevelStr(val) {
        if (!val) return "";
        let s = String(val).trim().toUpperCase().replace(/[\s_\-\/]/g, '');
        if (s === 'JLPT' || s === 'TOPIK' || s === 'JLPTTOPIK') return 'JLPTTOPIK';
        return s;
    }

    function renderUnits(level) {
        const container = document.getElementById('container-units');
        container.innerHTML = "";

        const combinedData = [...rawShadowData, ...rawBlocksData, ...rawDialogueData, ...rawVocabData];
        const targetLevelNormalized = normalizeLevelStr(level);

        const filtered = combinedData.filter(i => {
            const l = Array.isArray(i) ? i[1] : i.level;
            return normalizeLevelStr(l) === targetLevelNormalized;
        });
        const units = [...new Set(filtered.map(i => Array.isArray(i) ? i[2] : i.unit_id))].filter(Boolean).sort((a,b) => a - b);

        if (units.length > 0) {
            units.forEach(u => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `第 ${u} 單元`;
                btn.onclick = () => selectUnit(u);
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = `<div style="color: #6b7280; grid-column: span 3; padding: 20px 0;">此程度 (${level}) 尚無資料</div>`;
        }
    }

    function selectUnit(unitId) {
        currentConfig.unit_id = unitId;
        document.getElementById('lbl-stage-unit').innerText = `Level ${currentConfig.level} | 第 ${unitId} 單元`;

        const container = document.getElementById('container-stages');
        container.innerHTML = "";

        const combinedData = [...rawShadowData, ...rawBlocksData, ...rawDialogueData, ...rawVocabData];
        const targetLevelNormalized = normalizeLevelStr(currentConfig.level);

        const filtered = combinedData.filter(i => {
            const l = Array.isArray(i) ? i[1] : i.level;
            const u = Array.isArray(i) ? i[2] : i.unit_id;
            return normalizeLevelStr(l) === targetLevelNormalized && String(u) === String(unitId);
        });
        const stages = [...new Set(filtered.map(i => Array.isArray(i) ? i[3] : i.stage))].filter(Boolean).sort((a,b) => a - b);

        if (stages.length > 0) {
            stages.forEach(s => {
                const card = document.createElement('div');
                card.className = "stage-card-item";

                const title = document.createElement('div');
                title.className = "stage-card-title";
                title.innerText = `第 ${s} 關卡 (${currentConfig.unit_id}-${s})`;

                const btnGroup = document.createElement('div');
                btnGroup.className = "stage-btn-group";

                const btnGrammar = document.createElement('button');
                btnGrammar.className = "btn-stage-action btn-grammar-stage";
                btnGrammar.innerHTML = `<i class="fa-solid fa-book"></i> 📖 語法`;
                btnGrammar.onclick = () => selectStageAndMode(s, 'grammar');

                const btnShadow = document.createElement('button');
                btnShadow.className = "btn-stage-action";
                btnShadow.innerHTML = `<i class="fa-solid fa-microphone"></i> 🎙️ 跟讀`;
                btnShadow.onclick = () => selectStageAndMode(s, 'shadow');

                const btnBlocks = document.createElement('button');
                btnBlocks.className = "btn-stage-action";
                btnBlocks.innerHTML = `<i class="fa-solid fa-puzzle-piece"></i> 🧩 重組`;
                btnBlocks.onclick = () => selectStageAndMode(s, 'blocks');

                const btnDialogue = document.createElement('button');
                btnDialogue.className = "btn-stage-action btn-dialogue-stage";
                btnDialogue.innerHTML = `<i class="fa-solid fa-comments"></i> 💬 對話`;
                btnDialogue.onclick = () => selectStageAndMode(s, 'dialogue');

                const btnVocabShadow = document.createElement('button');
                btnVocabShadow.className = "btn-stage-action btn-vocab-stage";
                btnVocabShadow.innerHTML = `<i class="fa-solid fa-font"></i> 🗣️ 單字跟讀`;
                btnVocabShadow.onclick = () => selectStageAndMode(s, 'vocab_shadow');

                const btnVocabType = document.createElement('button');
                btnVocabType.className = "btn-stage-action btn-vocab-stage";
                btnVocabType.innerHTML = `<i class="fa-solid fa-keyboard"></i> ⌨️ 單字聽打`;
                btnVocabType.onclick = () => selectStageAndMode(s, 'vocab_type');

                const btnVocabChoice = document.createElement('button');
                btnVocabChoice.className = "btn-stage-action btn-vocab-stage";
                btnVocabChoice.innerHTML = `<i class="fa-solid fa-list-check"></i> 🎯 單字選擇`;
                btnVocabChoice.onclick = () => selectStageAndMode(s, 'vocab_choice');

                btnGroup.appendChild(btnGrammar);
                btnGroup.appendChild(btnShadow);
                btnGroup.appendChild(btnBlocks);
                btnGroup.appendChild(btnDialogue);
                btnGroup.appendChild(btnVocabShadow);
                btnGroup.appendChild(btnVocabType);
                btnGroup.appendChild(btnVocabChoice);

                card.appendChild(title);
                card.appendChild(btnGroup);

                container.appendChild(card);
            });
        } else {
            container.innerHTML = `<div style="color: #6b7280; padding: 20px 0;">此單元尚無關卡資料</div>`;
        }

        goToStep('step-stage');
    }

    function selectStageAndMode(stage, mode) {
        currentConfig.stage = stage;
        currentConfig.mode = mode;

        if (mode === 'grammar') {
            const targetLevelNormalized = normalizeLevelStr(currentConfig.level);

            const matchGrammar = globalGrammarData.find(g => 
                normalizeLevelStr(g.level) === targetLevelNormalized &&
                String(g.unit_id) === String(currentConfig.unit_id) &&
                String(g.stage) === String(stage)
            );

            if (matchGrammar && (
                (matchGrammar.dialogs && matchGrammar.dialogs.length > 0) || 
                (matchGrammar.example && matchGrammar.example.trim() !== '') ||
                (matchGrammar.ready && matchGrammar.ready.trim() !== '') ||
                (matchGrammar.question && matchGrammar.question.trim() !== '')
            )) {
                startGrammarChallenge(matchGrammar);
            } else {
                alert("此關卡目前沒有設定獨立語法觀念喔！");
            }
        } else if (mode === 'dialogue') {
            const targetLevelNormalized = normalizeLevelStr(currentConfig.level);

            const matchDialogue = rawDialogueData.find(d => 
                normalizeLevelStr(d.level) === targetLevelNormalized &&
                String(d.unit_id) === String(currentConfig.unit_id) &&
                String(d.stage) === String(stage)
            );

            if (matchDialogue) {
                startDialogueChallenge(matchDialogue);
            } else {
                alert("此關卡目前沒有設定對話練習喔！");
            }
        } else if (mode.startsWith('vocab_')) {
            startVocabChallenge(mode);
        } else {
            startMainQuiz();
        }
    }

    // --- 全新單字挑戰 (Vocabulary Challenge) 邏輯 ---

    function getTranslationByLang(item) {
        if (!item) return "";
        if (currentConfig.lang === 'en') return item.en || item.zh_tw || "";
        if (currentConfig.lang === 'kr' || currentConfig.lang === 'ja') return item.ja || item.zh_tw || "";
        return item.zh_tw || "";
    }

    function startVocabChallenge(vocabMode) {
        stopSpeechRecognition();
        const targetLevelNormalized = normalizeLevelStr(currentConfig.level);

        vocabQuestions = rawVocabData.filter(v => 
            normalizeLevelStr(v.level) === targetLevelNormalized &&
            String(v.unit_id) === String(currentConfig.unit_id) &&
            String(v.stage) === String(currentConfig.stage)
        );

        if (vocabQuestions.length === 0) {
            alert("此關卡目前沒有設定單字練習喔！");
            return;
        }

        vocabIndex = 0;
        const catMap = { 'korean': '韓文', 'japanese': '日文', 'english': '英文' };
        const modeTitleMap = {
            'vocab_shadow': '🗣️ 單字跟讀',
            'vocab_type': '⌨️ 單字聽打',
            'vocab_choice': '🎯 單字選擇'
        };

        const infoText = `${catMap[currentConfig.category] || currentConfig.category} | Level ${currentConfig.level} | 單元 ${currentConfig.unit_id} - 關卡 ${currentConfig.stage} (${modeTitleMap[vocabMode]})`;
        document.querySelectorAll('.lbl-quiz-info').forEach(e => e.innerText = infoText);

        if (vocabMode === 'vocab_shadow') {
            goToStep('step-quiz-vocab-shadow');
        } else if (vocabMode === 'vocab_type') {
            goToStep('step-quiz-vocab-type');
        } else if (vocabMode === 'vocab_choice') {
            goToStep('step-quiz-vocab-choice');
        }

        displayVocabQuestion();
    }

    function displayVocabQuestion() {
        stopSpeechRecognition();
        if (!vocabQuestions || vocabQuestions.length === 0) return;

        const currentVocab = vocabQuestions[vocabIndex];
        const total = vocabQuestions.length;

        if (currentConfig.mode === 'vocab_shadow') {
            document.getElementById('lbl-vocab-progress').innerText = `${vocabIndex + 1} / ${total}`;
            document.getElementById('lbl-vocab-target-text').innerText = currentVocab.text || "";
            document.getElementById('lbl-vocab-translation').innerText = "";
            document.getElementById('lbl-vocab-recognized-text').innerText = "-";
            document.getElementById('lbl-vocab-score').innerText = "得分：--";

            document.getElementById('btn-vocab-prev').disabled = vocabIndex === 0;
            document.getElementById('btn-vocab-next').disabled = vocabIndex === total - 1;

        } else if (currentConfig.mode === 'vocab_type') {
            document.getElementById('lbl-vocab-type-progress').innerText = `${vocabIndex + 1} / ${total}`;
            document.getElementById('input-vocab-type').value = "";
            document.getElementById('lbl-vocab-type-translation').innerText = "";
            document.getElementById('lbl-vocab-type-score').innerText = "等待輸入...";
            document.getElementById('lbl-vocab-type-score').style.color = "#58cc02";

            document.getElementById('btn-vocab-type-prev').disabled = vocabIndex === 0;
            document.getElementById('btn-vocab-type-next').disabled = vocabIndex === total - 1;

            playVocabAudio();

        } else if (currentConfig.mode === 'vocab_choice') {
            document.getElementById('lbl-vocab-choice-progress').innerText = `${vocabIndex + 1} / ${total}`;
            document.getElementById('lbl-vocab-choice-text').innerText = currentVocab.text || "";
            document.getElementById('lbl-vocab-choice-score').innerText = "請選擇正確意思";
            document.getElementById('lbl-vocab-choice-score').style.color = "#58cc02";

            const container = document.getElementById('container-vocab-choices');
            container.innerHTML = "";

            let choices = (currentVocab.choice || '').split('/').map(s => s.trim()).filter(Boolean);
            const correctAns = currentVocab.zh_tw.trim();
            if (correctAns && !choices.includes(correctAns)) {
                choices.push(correctAns);
            }

            choices.sort(() => Math.random() - 0.5);

            choices.forEach(cText => {
                const btn = document.createElement('button');
                btn.className = 'btn-vocab-choice';
                btn.innerText = cText;
                btn.onclick = () => checkVocabChoiceAnswer(cText);
                container.appendChild(btn);
            });

            document.getElementById('btn-vocab-choice-prev').disabled = vocabIndex === 0;
            document.getElementById('btn-vocab-choice-next').disabled = vocabIndex === total - 1;
        }
    }

    function playVocabAudio() {
        stopSpeechRecognition();
        const currentVocab = vocabQuestions[vocabIndex];
        if (!currentVocab) return;

        if (currentVocab.audio_url && currentVocab.audio_url.trim() !== '') {
            new Audio(currentVocab.audio_url).play().catch(() => speakTTS(currentVocab.text));
        } else {
            speakTTS(currentVocab.text);
        }
    }

    function checkVocabTypeAnswer() {
        const currentVocab = vocabQuestions[vocabIndex];
        const userText = cleanStringForCompare(document.getElementById('input-vocab-type').value);
        const targetText = cleanStringForCompare(currentVocab.text);

        const scoreBadge = document.getElementById('lbl-vocab-type-score');
        const transLbl = document.getElementById('lbl-vocab-type-translation');

        if (userText === targetText) {
            scoreBadge.innerText = "🎉 完全正確！太棒了！";
            scoreBadge.style.color = "#58cc02";
            transLbl.innerText = `💡 翻譯：${getTranslationByLang(currentVocab)}`;
            playVocabAudio();
        } else {
            scoreBadge.innerText = "❌ 答案不太對喔，再試試看！";
            scoreBadge.style.color = "#ff4b4b";
        }
    }

    function checkVocabChoiceAnswer(selectedText) {
        const currentVocab = vocabQuestions[vocabIndex];
        const correctAns = currentVocab.zh_tw.trim();
        const scoreBadge = document.getElementById('lbl-vocab-choice-score');

        if (selectedText.trim() === correctAns) {
            scoreBadge.innerText = "🎉 正確答案！太棒了！";
            scoreBadge.style.color = "#58cc02";
            playVocabAudio();
        } else {
            scoreBadge.innerText = `❌ 選錯囉！正確答案是：${correctAns}`;
            scoreBadge.style.color = "#ff4b4b";
        }
    }

    function prevVocabQuestion() {
        if (vocabIndex > 0) {
            vocabIndex--;
            displayVocabQuestion();
        }
    }

    function nextVocabQuestion() {
        if (vocabIndex < vocabQuestions.length - 1) {
            vocabIndex++;
            displayVocabQuestion();
        }
    }

    // --- 聊天氣泡對話 (Dialogue Challenge) 邏輯 ---

    function startDialogueChallenge(dialogueItem) {
        currentDialogueItem = dialogueItem;
        dialogueList = [];

        for (let i = 1; i <= 8; i++) {
            const aKey = `a${i}`;
            const bKey = `b${i}`;
            const axKey = `a${i}x`;
            const bxKey = `b${i}x`;

            const aText = (dialogueItem[aKey] || '').trim();
            const bText = (dialogueItem[bKey] || '').trim();
            const axText = (dialogueItem[axKey] || '').trim();
            const bxText = (dialogueItem[bxKey] || '').trim();

            if (aText) {
                dialogueList.push({
                    speaker: 'A',
                    targetText: aText,
                    fillText: axText || aText,
                    audioUrl: dialogueItem.audio_url || ''
                });
            }
            if (bText) {
                dialogueList.push({
                    speaker: 'B',
                    targetText: bText,
                    fillText: bxText || bText,
                    audioUrl: dialogueItem.audio_url || ''
                });
            }
        }

        if (dialogueList.length === 0) {
            alert("此關卡對話資料為空！");
            return;
        }

        dialogueIndex = 0;
        dialogueSubMode = 'basic';
        userRole = 'A';
        
        switchDialogueMode('basic');
        switchUserRole('A');

        const catMap = { 'korean': '韓文', 'japanese': '日文', 'english': '英文' };
        document.querySelectorAll('.lbl-quiz-info').forEach(e => {
            e.innerText = `${catMap[currentConfig.category] || currentConfig.category} | Level ${currentConfig.level} | 單元 ${currentConfig.unit_id} - 關卡 ${currentConfig.stage} (💬 對話挑戰)`;
        });

        goToStep('step-quiz-dialogue');
        renderChatWindow();
    }

    function switchDialogueMode(mode) {
        dialogueSubMode = mode;
        dialogueIndex = 0;
        ['basic', 'fill', 'blind'].forEach(m => {
            const btn = document.getElementById(`btn-mode-${m}`);
            if (btn) btn.classList.remove('active');
        });
        document.getElementById(`btn-mode-${mode}`).classList.add('active');

        isBlindUnlocked = false;
        renderChatWindow();
    }

    function switchUserRole(role) {
        userRole = role;
        dialogueIndex = 0;
        ['a', 'b'].forEach(r => {
            const btn = document.getElementById(`btn-role-${r.toLowerCase()}`);
            if (btn) btn.classList.remove('active');
        });
        document.getElementById(`btn-role-${role.toLowerCase()}`).classList.add('active');

        renderChatWindow();
    }

    function renderChatWindow() {
        stopSpeechRecognition();
        if (!dialogueList || dialogueList.length === 0) return;

        const chatWin = document.getElementById('chat-window');
        chatWin.innerHTML = '';

        for (let idx = 0; idx <= dialogueIndex; idx++) {
            const item = dialogueList[idx];
            const isCurrentTarget = (idx === dialogueIndex);

            const row = document.createElement('div');
            row.className = `chat-bubble-row speaker-${item.speaker}`;

            const label = document.createElement('div');
            label.className = 'chat-speaker-label';
            const isUser = (item.speaker === userRole);
            label.innerText = `Speaker ${item.speaker}${isUser ? ' (你)' : ''}`;

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            if (isCurrentTarget) {
                bubble.classList.add('active-target');
            }

            let bubbleText = item.targetText;

            if (dialogueSubMode === 'fill' && isCurrentTarget && !isBlindUnlocked) {
                bubbleText = item.fillText;
            } else if (dialogueSubMode === 'blind' && isCurrentTarget && !isBlindUnlocked) {
                bubbleText = "??? (聽音或對話解鎖)";
            }

            const textSpan = document.createElement('span');
            textSpan.innerText = bubbleText;
            bubble.appendChild(textSpan);

            const playBtn = document.createElement('button');
            playBtn.className = 'btn-bubble-play';
            playBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
            playBtn.onclick = (e) => {
                e.stopPropagation();
                playSpecificDialogueAudio(idx);
            };
            bubble.appendChild(playBtn);

            row.appendChild(label);
            row.appendChild(bubble);
            chatWin.appendChild(row);
        }

        setTimeout(() => {
            chatWin.scrollTop = chatWin.scrollHeight;
        }, 50);

        const blindBox = document.getElementById('box-blind-unlock');
        if (dialogueSubMode === 'blind' && !isBlindUnlocked) {
            blindBox.style.display = 'block';
        } else {
            blindBox.style.display = 'none';
        }

        document.getElementById('lbl-dialogue-progress').innerText = `${dialogueIndex + 1} / ${dialogueList.length}`;
        document.getElementById('btn-dialogue-prev').disabled = dialogueIndex === 0;
        document.getElementById('btn-dialogue-next').disabled = dialogueIndex === dialogueList.length - 1;

        const currentItem = dialogueList[dialogueIndex];
        if (currentItem && currentItem.speaker !== userRole) {
            playDialogueAudio();
        }
    }

    function unlockBlindTextManually() {
        isBlindUnlocked = true;
        renderChatWindow();
    }

    function playSpecificDialogueAudio(idx) {
        stopSpeechRecognition();
        if (!dialogueList || !dialogueList[idx]) return;
        const target = dialogueList[idx];
        if (target.audioUrl && target.audioUrl.trim() !== '') {
            new Audio(target.audioUrl).play().catch(() => speakTTS(target.targetText));
        } else {
            speakTTS(target.targetText);
        }
    }

    function playDialogueAudio() {
        playSpecificDialogueAudio(dialogueIndex);
    }

    function prevDialogueSentence() {
        if (dialogueIndex > 0) {
            dialogueIndex--;
            isBlindUnlocked = false;
            renderChatWindow();
        }
    }

    function nextDialogueSentence() {
        if (dialogueIndex < dialogueList.length - 1) {
            dialogueIndex++;
            isBlindUnlocked = false;
            renderChatWindow();
        }
    }

    // --- 語法小教室相關邏輯 ---

    function startGrammarChallenge(grammarData) {
        currentGrammarItem = grammarData;
        currentDialogIndex = 0;
        
        document.getElementById('lbl-grammar-info').innerText = `語法教室 | Level ${currentConfig.level} - Unit ${currentConfig.unit_id} - Stage ${currentConfig.stage}`;
        document.getElementById('area-grammar-all-history').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'none';
        document.getElementById('area-grammar-ready').style.display = 'none';
        document.getElementById('area-grammar-quiz').style.display = 'none';

        if (grammarData.dialogs && grammarData.dialogs.length > 0) {
            document.getElementById('area-grammar-dialog').style.display = 'block';
            showCurrentGrammarDialog();
        } else if (grammarData.example && grammarData.example.trim() !== '') {
            showExampleArea();
        } else if (grammarData.ready && grammarData.ready.trim() !== '') {
            showReadyArea();
        } else {
            showGrammarQuizArea();
        }

        goToStep('step-grammar');
    }

    function playGrammarAudio(dialogIdx) {
        stopSpeechRecognition();
        if (!currentGrammarItem) return;

        let audioUrl = "";
        if (dialogIdx === 1) audioUrl = currentGrammarItem.gram2_audio;
        else if (dialogIdx === 2) audioUrl = currentGrammarItem.gram3_audio;

        const textToSpeak = (currentGrammarItem.dialogs && currentGrammarItem.dialogs[dialogIdx])
            ? currentGrammarItem.dialogs[dialogIdx].replace(/^[\s\r\n\u3000]+/g, '').trim()
            : "";

        if (audioUrl && audioUrl.trim() !== '') {
            new Audio(audioUrl).play().catch(() => {
                if (textToSpeak) speakTTS(textToSpeak);
            });
        } else if (textToSpeak) {
            speakTTS(textToSpeak);
        }
    }

    function showCurrentGrammarDialog() {
        if (!currentGrammarItem || !currentGrammarItem.dialogs) return;

        const total = currentGrammarItem.dialogs.length;
        document.getElementById('lbl-dialog-counter').innerText = `${currentDialogIndex + 1} / ${total}`;

        document.getElementById('btn-prev-dialog').disabled = currentDialogIndex === 0;

        const nextBtn = document.getElementById('btn-next-dialog');
        if (currentDialogIndex === total - 1) {
            if (currentGrammarItem.example && currentGrammarItem.example.trim() !== '') {
                nextBtn.innerHTML = `看例句 <i class="fa-solid fa-arrow-right"></i>`;
            } else if (currentGrammarItem.ready && currentGrammarItem.ready.trim() !== '') {
                nextBtn.innerHTML = `準備測驗 <i class="fa-solid fa-arrow-right"></i>`;
            } else if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
                nextBtn.innerHTML = `進入測驗 <i class="fa-solid fa-pen-to-square"></i>`;
            } else {
                nextBtn.innerHTML = `完成關卡 <i class="fa-solid fa-check"></i>`;
            }
        } else {
            nextBtn.innerHTML = `下一步 <i class="fa-solid fa-arrow-right"></i>`;
        }

        const rawStr = currentGrammarItem.dialogs[currentDialogIndex] || "";
        currentFullDialogText = rawStr
            .replace(/^[\s\r\n\u3000]+/g, '')
            .replace(/\r/g, '')
            .trim();

        const audioBtn = document.getElementById('btn-gram2-audio');
        if (currentDialogIndex === 1 || currentDialogIndex === 2) {
            audioBtn.style.display = 'block';
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                playGrammarAudio(currentDialogIndex);
            };
            playGrammarAudio(currentDialogIndex);
        } else {
            audioBtn.style.display = 'none';
        }

        startTypewriter(currentFullDialogText);
    }

    function startTypewriter(text) {
        if (typewriterTimer) clearInterval(typewriterTimer);
        const box = document.getElementById('lbl-grammar-dialog');
        box.textContent = "";
        isTypewriterTyping = true;
        
        let charIndex = 0;
        typewriterTimer = setInterval(() => {
            if (charIndex < text.length) {
                box.textContent = text.substring(0, charIndex + 1);
                charIndex++;
            } else {
                clearInterval(typewriterTimer);
                isTypewriterTyping = false;
            }
        }, 35);
    }

    function completeTypewriterImmediately() {
        if (isTypewriterTyping) {
            clearInterval(typewriterTimer);
            document.getElementById('lbl-grammar-dialog').textContent = currentFullDialogText;
            isTypewriterTyping = false;
        }
    }

    function nextGrammarDialog() {
        if (isTypewriterTyping) {
            completeTypewriterImmediately();
            return;
        }

        if (!currentGrammarItem) return;

        if (currentGrammarItem.dialogs && currentDialogIndex < currentGrammarItem.dialogs.length - 1) {
            currentDialogIndex++;
            showCurrentGrammarDialog();
        } else {
            processAfterDialogs();
        }
    }

    function prevGrammarDialog() {
        if (isTypewriterTyping) completeTypewriterImmediately();

        if (currentDialogIndex > 0) {
            currentDialogIndex--;
            showCurrentGrammarDialog();
        }
    }

    function skipGrammarDialog() {
        if (typewriterTimer) clearInterval(typewriterTimer);
        isTypewriterTyping = false;
        processAfterDialogs();
    }

    function processAfterDialogs() {
        renderGrammarHistoryList();
        document.getElementById('area-grammar-dialog').style.display = 'none';

        if (currentGrammarItem.example && currentGrammarItem.example.trim() !== '') {
            showExampleArea();
        } else if (currentGrammarItem.ready && currentGrammarItem.ready.trim() !== '') {
            showReadyArea();
        } else if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
            showGrammarQuizArea();
        } else {
            goToStep('step-stage');
        }
    }

    function showExampleArea() {
        document.getElementById('area-grammar-dialog').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'block';

        const container = document.getElementById('container-example-list');
        container.innerHTML = '';

        const examples = currentGrammarItem.example.split('/').map(s => s.trim()).filter(Boolean);
        const audioUrls = (currentGrammarItem.example_audio || '').split('/').map(s => s.trim());

        examples.forEach((exText, idx) => {
            const row = document.createElement('div');
            row.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: #f3f4f6; padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; font-size: 1.1rem; font-weight: bold;";
            
            const textSpan = document.createElement('span');
            textSpan.innerText = `${idx + 1}. ${exText}`;

            const playBtn = document.createElement('button');
            playBtn.className = 'btn-circle btn-listen';
            playBtn.style.cssText = "width: 40px; height: 40px; font-size: 0.9rem; flex-shrink: 0;";
            playBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
            
            const audioUrl = audioUrls[idx] || '';
            playBtn.onclick = () => {
                stopSpeechRecognition();
                if (audioUrl) {
                    new Audio(audioUrl).play().catch(() => speakTTS(exText));
                } else {
                    speakTTS(exText);
                }
            };

            row.appendChild(textSpan);
            row.appendChild(playBtn);
            container.appendChild(row);
        });
    }

    function goToReadyPage() {
        document.getElementById('area-grammar-example').style.display = 'none';
        if (currentGrammarItem.ready && currentGrammarItem.ready.trim() !== '') {
            showReadyArea();
        } else if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
            showGrammarQuizArea();
        } else {
            goToStep('step-stage');
        }
    }

    function showReadyArea() {
        document.getElementById('area-grammar-dialog').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'none';
        document.getElementById('area-grammar-ready').style.display = 'block';

        document.getElementById('lbl-ready-text').innerText = (currentGrammarItem.ready || "準備好進行測驗了嗎？").trim();
    }

    function enterGrammarQuizFromReady() {
        document.getElementById('area-grammar-ready').style.display = 'none';
        if (currentGrammarItem.question && currentGrammarItem.question.trim() !== '') {
            showGrammarQuizArea();
        } else {
            goToStep('step-stage');
        }
    }

    function renderGrammarHistoryList() {
        const container = document.getElementById('container-dialog-history');
        container.innerHTML = "";

        if (currentGrammarItem && currentGrammarItem.dialogs && currentGrammarItem.dialogs.length > 0) {
            let listToRender = [...currentGrammarItem.dialogs];

            if (listToRender.length > 1) {
                listToRender.pop();
            }

            listToRender.forEach((dText, idx) => {
                const item = document.createElement('div');
                item.className = 'dialog-history-item';
                const cleanText = dText.replace(/^[\s\r\n\u3000]+/g, '').replace(/\r/g, '').trim();
                item.innerHTML = `<span class="num">${idx + 1}.</span> ${cleanText}`;
                container.appendChild(item);
            });
            document.getElementById('area-grammar-all-history').style.display = 'block';
        }
    }

    function showGrammarQuizArea() {
        document.getElementById('area-grammar-dialog').style.display = 'none';
        document.getElementById('area-grammar-example').style.display = 'none';
        document.getElementById('area-grammar-ready').style.display = 'none';
        document.getElementById('area-grammar-quiz').style.display = 'block';
        document.getElementById('box-grammar-result').style.display = 'none';

        renderGrammarHistoryList();

        const rawQuestions = currentGrammarItem.question.split('/').map(s => s.trim()).filter(Boolean);
        userGrammarAnswers = new Array(rawQuestions.length).fill('');
        activeBlankIndex = 0;

        const qContainer = document.getElementById('container-grammar-questions');
        qContainer.innerHTML = '';

        rawQuestions.forEach((qStr, idx) => {
            const div = document.createElement('div');
            div.className = 'grammar-q-item';
            
            const formattedText = qStr.replace(/__/g, `<span class="blank-slot" id="blank-slot-${idx}" onclick="setActiveBlank(${idx})">___</span>`);
            div.innerHTML = `${idx + 1}. ${formattedText}`;
            qContainer.appendChild(div);
        });

        const cContainer = document.getElementById('container-grammar-choices');
        cContainer.innerHTML = '';

        const choices = currentGrammarItem.choice.split('/').map(s => s.trim()).filter(Boolean);
        choices.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'block-chip';
            btn.innerText = opt;
            btn.onclick = () => fillGrammarAnswer(opt);
            cContainer.appendChild(btn);
        });
    }

    function setActiveBlank(index) {
        activeBlankIndex = index;
    }

    function fillGrammarAnswer(optionText) {
        userGrammarAnswers[activeBlankIndex] = optionText;
        const slot = document.getElementById(`blank-slot-${activeBlankIndex}`);
        if (slot) {
            slot.innerText = optionText;
        }

        const nextBlank = userGrammarAnswers.findIndex(a => a === '');
        if (nextBlank !== -1) {
            activeBlankIndex = nextBlank;
        }
    }

    function checkGrammarQuiz() {
        const rawQuestions = currentGrammarItem.question.split('/').map(s => s.trim()).filter(Boolean);
        const correctAnswers = currentGrammarItem.answer.split('/').map(s => s.trim().replace(/\s+/g, ''));

        let isAllCorrect = true;

        if (userGrammarAnswers.includes('')) {
            alert('請填寫完所有空格後再送出！');
            return;
        }

        rawQuestions.forEach((qStr, idx) => {
            const builtSentence = qStr.replace(/__/g, userGrammarAnswers[idx]).replace(/\s+/g, '');
            const targetSentence = correctAnswers[idx];

            if (builtSentence !== targetSentence) {
                isAllCorrect = false;
            }
        });

        const resultBox = document.getElementById('box-grammar-result');
        const resultText = document.getElementById('lbl-grammar-result-text');
        const actionBtn = document.getElementById('btn-grammar-action');

        resultBox.style.display = 'block';

        if (isAllCorrect) {
            resultText.innerText = currentGrammarItem.correct || "🎉 完全正確！通關成功！";
            resultText.style.color = "#58cc02";
            actionBtn.innerHTML = `<i class="fa-solid fa-flag-checkered"></i> 完成關卡`;
            actionBtn.style.background = "#58cc02";
            actionBtn.onclick = () => goToStep('step-stage');
        } else {
            resultText.innerText = currentGrammarItem.incorrect || "❌ 答案不太對喔，再試一次！";
            resultText.style.color = "#ff4b4b";
            actionBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> 再來一次`;
            actionBtn.style.background = "#ff4b4b";
            actionBtn.onclick = () => showGrammarQuizArea();
        }
    }

    // --- 常規跟讀 / 重組測驗邏輯 ---

    function startMainQuiz() {
        stopSpeechRecognition();

        const catMap = { 'korean': '韓文', 'japanese': '日文', 'english': '英文' };
        const modeTitle = currentConfig.mode === 'shadow' ? '跟讀挑戰' : '重組挑戰';
        const infoText = `${catMap[currentConfig.category] || currentConfig.category} | Level ${currentConfig.level} | 單元 ${currentConfig.unit_id} - 關卡 ${currentConfig.stage} (${modeTitle})`;
        document.querySelectorAll('.lbl-quiz-info').forEach(e => e.innerText = infoText);

        const langIndexMap = { 'zh': 5, 'en': 6, 'kr': 7, 'ja': 7 };
        const langIdx = langIndexMap[currentConfig.lang] !== undefined ? langIndexMap[currentConfig.lang] : 5;
        const targetLevelNormalized = normalizeLevelStr(currentConfig.level);

        if (currentConfig.mode === 'shadow') {
            goToStep('step-quiz-shadow');

            questions = rawShadowData.filter(i => 
                normalizeLevelStr(i[1]) === targetLevelNormalized &&
                String(i[2]) === String(currentConfig.unit_id) &&
                String(i[3]) === String(currentConfig.stage)
            ).map(i => ({
                id: i[0],
                text: i[4],
                translation: i[langIdx] || i[5] || '',
                audioUrl: i[8],
                hint: i[9] || ''
            }));
        } else {
            goToStep('step-quiz-blocks');
            
            const blockLangIndexMap = { 'zh': 6, 'en': 7, 'kr': 8, 'ja': 8 };
            const bLangIdx = blockLangIndexMap[currentConfig.lang] !== undefined ? blockLangIndexMap[currentConfig.lang] : 6;

            questions = rawBlocksData.filter(i => 
                normalizeLevelStr(i[1]) === targetLevelNormalized &&
                String(i[2]) === String(currentConfig.unit_id) &&
                String(i[3]) === String(currentConfig.stage)
            ).map(i => {
                let rawOptions = (i[5] || '').split(',').map(s => s.trim()).filter(Boolean);
                let shuffled = [...rawOptions].sort(() => Math.random() - 0.5);

                return {
                    id: i[0],
                    fullText: i[4],
                    options: shuffled,
                    translation: i[bLangIdx] || i[6] || '',
                    audioUrl: i[9] || ''
                };
            });
        }

        currentIndex = 0;
        if (questions.length > 0) {
            displayQuestion();
        } else {
            alert("該關卡尚無練習題目！");
        }
    }

    function displayQuestion() {
        stopSpeechRecognition();

        if (!questions || questions.length === 0) return;
        const q = questions[currentIndex];

        document.querySelectorAll('.lbl-progress').forEach(e => e.innerText = `${currentIndex + 1} / ${questions.length}`);
        
        if (currentConfig.mode === 'shadow') {
            document.getElementById('lbl-target-text').innerText = q.text || "";
            document.getElementById('lbl-translation').innerText = q.translation || "";
            const hintElem = document.getElementById('lbl-hint');
            if (q.hint && q.hint.trim() !== '') {
                hintElem.innerText = `💡 提示：${q.hint.trim()}`;
                hintElem.style.display = "inline-block";
            } else {
                hintElem.style.display = "none";
            }
            document.getElementById('lbl-recognized-text').innerText = "-";
            document.getElementById('lbl-score').innerText = "得分：--";
            document.getElementById('btn-prev').disabled = currentIndex === 0;
            document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
        } else {
            document.getElementById('lbl-block-translation').innerText = q.translation || "";
            document.getElementById('lbl-block-score').innerText = "請選取字塊組合句子";
            document.getElementById('lbl-block-score').style.color = "#58cc02";
            document.getElementById('btn-block-prev').disabled = currentIndex === 0;
            document.getElementById('btn-block-next').disabled = currentIndex === questions.length - 1;

            selectedBlockIndices = [];
            renderBlocks();
            playBlockAudio();
        }
    }

    function renderBlocks() {
        const q = questions[currentIndex];
        const zoneOptions = document.getElementById('zone-options');
        const zoneAnswer = document.getElementById('zone-answer');

        zoneOptions.innerHTML = "";
        zoneAnswer.innerHTML = "";

        q.options.forEach((optText, idx) => {
            const btn = document.createElement('div');
            btn.className = 'block-chip';
            if (selectedBlockIndices.includes(idx)) {
                btn.classList.add('used');
            }
            btn.innerText = optText;
            btn.onclick = () => selectBlock(idx);
            zoneOptions.appendChild(btn);
        });

        selectedBlockIndices.forEach(idx => {
            const btn = document.createElement('div');
            btn.className = 'block-chip';
            btn.innerText = q.options[idx];
            btn.onclick = () => deselectBlock(idx);
            zoneAnswer.appendChild(btn);
        });
    }

    function selectBlock(idx) {
        selectedBlockIndices.push(idx);
        renderBlocks();
    }

    function deselectBlock(idx) {
        selectedBlockIndices = selectedBlockIndices.filter(i => i !== idx);
        renderBlocks();
    }

    function checkBlockAnswer() {
        const q = questions[currentIndex];
        const userSentence = selectedBlockIndices.map(i => q.options[i]).join('');
        const targetSentence = q.fullText.replace(/\s+/g, '');

        const scoreBadge = document.getElementById('lbl-block-score');

        if (userSentence === targetSentence) {
            scoreBadge.innerText = "🎉 完全正確！太棒了！";
            scoreBadge.style.color = "#58cc02";
            playBlockAudio();
        } else {
            scoreBadge.innerText = "❌ 答案不太對喔，再試試看！";
            scoreBadge.style.color = "#ff4b4b";
        }
    }

    function playBlockAudio() {
        stopSpeechRecognition();
        const q = questions[currentIndex];
        if (!q) return;
        if (q.audioUrl && q.audioUrl.trim() !== '') {
            new Audio(q.audioUrl).play().catch(() => speakTTS(q.fullText));
        } else {
            speakTTS(q.fullText);
        }
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            displayQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            displayQuestion();
        }
    }

    function playAudio() {
        stopSpeechRecognition();
        if (!questions[currentIndex]) return;
        const q = questions[currentIndex];
        if (q.audioUrl && q.audioUrl.trim() !== "") {
            new Audio(q.audioUrl).play().catch(() => speakTTS(q.text));
        } else {
            speakTTS(q.text);
        }
    }

    function speakTTS(text) {
        if (!text) return;
        stopSpeechRecognition();
        const synth = window.speechSynthesis;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        utterance.lang = langMap[currentConfig.category] || 'ko-KR';
        synth.speak(utterance);
    }

    function cleanStringForCompare(str) {
        if (!str) return "";
        return str.replace(/[.,?!~\s\r\n]/g, '').toLowerCase();
    }

    function calculateSimilarity(str1, str2) {
        const s1 = cleanStringForCompare(str1);
        const s2 = cleanStringForCompare(str2);
        if (!s1 || !s2) return 0;
        if (s1 === s2) return 100;
        
        let track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
        for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
        for (let j = 1; j <= s2.length; j += 1) track[j][0] = j;

        for (let j = 1; j <= s2.length; j += 1) {
            for (let i = 1; i <= s1.length; i += 1) {
                const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        
        const distance = track[s2.length][s1.length];
        const maxLength = Math.max(s1.length, s2.length);
        const score = Math.round((1 - distance / maxLength) * 100);
        return score < 0 ? 0 : score;
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("您的瀏覽器不支援語音辨識功能，請使用電腦版或 Android 的 Chrome 瀏覽器。");
            return;
        }

        stopSpeechRecognition();

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        recognition.lang = langMap[currentConfig.category] || 'ko-KR';

        recognition.onstart = () => {
            isRecording = true;
            document.querySelectorAll('.btn-record').forEach(b => b.classList.add('recording'));
            if (currentConfig.mode === 'vocab_shadow') {
                document.getElementById('lbl-vocab-recognized-text').innerText = "聆聽中...";
            } else if (currentConfig.mode !== 'dialogue') {
                document.getElementById('lbl-recognized-text').innerText = "聆聽中...";
            }
        };

        recognition.onend = () => {
            isRecording = false;
            document.querySelectorAll('.btn-record').forEach(b => b.classList.remove('recording'));
        };

        recognition.onresult = (event) => {
            if (!event.results || !event.results[0] || !event.results[0][0]) {
                if (currentConfig.mode === 'vocab_shadow') {
                    document.getElementById('lbl-vocab-recognized-text').innerText = "未接收到聲音，請再試一次";
                } else if (currentConfig.mode !== 'dialogue') {
                    document.getElementById('lbl-recognized-text').innerText = "未接收到聲音，請再試一次";
                }
                return;
            }

            const userSpeech = event.results[0][0].transcript;

            if (currentConfig.mode === 'vocab_shadow') {
                document.getElementById('lbl-vocab-recognized-text').innerText = userSpeech;
                const currentVocab = vocabQuestions[vocabIndex];
                const targetText = currentVocab ? (currentVocab.text || "") : "";
                const score = calculateSimilarity(targetText, userSpeech);
                document.getElementById('lbl-vocab-score').innerText = `得分：${score}分`;

                if (score >= 60) {
                    document.getElementById('lbl-vocab-translation').innerText = `💡 翻譯：${getTranslationByLang(currentVocab)}`;
                }

            } else if (currentConfig.mode === 'dialogue') {
                const currentSentence = dialogueList[dialogueIndex];
                if (currentSentence) {
                    const targetText = currentSentence.targetText || "";
                    const score = calculateSimilarity(targetText, userSpeech);

                    if (score >= 60 || dialogueSubMode === 'basic') {
                        isBlindUnlocked = true;
                        renderChatWindow();
                    }
                }
            } else {
                document.getElementById('lbl-recognized-text').innerText = userSpeech;
                const currentQ = questions[currentIndex];
                const targetText = currentQ ? (currentQ.text || "") : "";
                const score = calculateSimilarity(targetText, userSpeech);
                document.getElementById('lbl-score').innerText = `得分：${score}分`;
            }
        };

        recognition.onerror = (e) => {
            isRecording = false;
            document.querySelectorAll('.btn-record').forEach(b => b.classList.remove('recording'));

            if (e.error === 'aborted') {
                console.log("辨識被使用者或系統正常中斷");
                return;
            }

            console.error("語音辨識發生錯誤：", e.error);

            let msg = "錄音錯誤：";
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                msg += "麥克風權限被拒絕，請開啟存取權限！";
            } else if (e.error === 'no-speech') {
                msg += "沒有收到聲音，請確定說話聲音足夠大聲。";
            } else if (e.error === 'network') {
                msg += "網路異常，無法連線至 Google 辨識服務。";
            } else {
                msg += e.error;
            }
            
            if (currentConfig.mode === 'vocab_shadow') {
                document.getElementById('lbl-vocab-recognized-text').innerText = msg;
            } else if (currentConfig.mode !== 'dialogue') {
                document.getElementById('lbl-recognized-text').innerText = msg;
            }
        };
    }

    function toggleRecording() {
        if (isToggling) return;
        isToggling = true;

        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
        }

        if (isRecording) {
            stopSpeechRecognition();
            setTimeout(() => { isToggling = false; }, 300);
        } else {
            stopSpeechRecognition();

            setTimeout(() => {
                try {
                    initSpeechRecognition();
                    if (currentConfig.mode === 'vocab_shadow') {
                        document.getElementById('lbl-vocab-recognized-text').innerText = "麥克風啟動中...";
                    } else if (currentConfig.mode !== 'dialogue') {
                        document.getElementById('lbl-recognized-text').innerText = "麥克風啟動中...";
                    }

                    recognition.start();
                } catch(err) {
                    console.error("啟動錄音失敗:", err);
                    stopSpeechRecognition();
                } finally {
                    setTimeout(() => { isToggling = false; }, 400);
                }
            }, 250);
        }
    }

    window.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopSpeechRecognition();
        }
    });

    window.addEventListener('pagehide', () => {
        stopSpeechRecognition();
    });

    window.onload = () => {
        setUserLang('zh');
        selectCategory('korean');
    };
</script>
