<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多語種跟讀關卡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-blue: #1cb0f6;
            --duo-red: #ff4b4b;
            --duo-gray: #e5e7eb;
            --duo-dark: #1f2937;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .shadowing-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        .step-page { display: none; }
        .step-page.active { display: block; }

        h2.step-title {
            color: var(--duo-dark);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .option-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }

        .btn-option {
            background: white;
            border: 2px solid #e5e7eb;
            border-bottom: 4px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px 10px;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--duo-dark);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-option:hover {
            border-color: var(--duo-blue);
            color: var(--duo-blue);
        }

        .btn-option.selected {
            border-color: var(--duo-blue) !important;
            border-bottom-color: #1899d6 !important;
            background-color: #ddf4ff !important;
            color: var(--duo-blue) !important;
        }

        .btn-confirm {
            width: 100%;
            background: var(--duo-green);
            color: white;
            border: none;
            border-bottom: 4px solid #46a302;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-confirm:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-back-step {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .btn-back-step:hover { color: var(--duo-blue); }

        /* 💡 圖片對應的下拉彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            text-align: center;
        }

        .modal-close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #f3f4f6;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #9ca3af;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .modal-select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--duo-blue);
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--duo-dark);
            margin: 20px 0;
            outline: none;
            background: white;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .target-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1f2937;
            margin: 15px 0 5px 0;
            min-height: 2.5rem;
        }

        .translation-text {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 25px;
            min-height: 1.5rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-listen { background: var(--duo-blue); box-shadow: 0 4px 0 #1899d6; }
        .btn-record { background: var(--duo-red); box-shadow: 0 4px 0 #ea2b2b; }
        .btn-record.recording { animation: pulse 1s infinite; background: #dc2626; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .result-box {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .score-badge {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--duo-green);
            margin-top: 5px;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn-nav {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #374151;
        }

        .btn-nav:hover:not(:disabled) { background: #e5e7eb; }
        .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

        .challenge-header-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn-sub-nav {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            color: #4b5563;
        }

        .btn-sub-nav:hover { background: #e5e7eb; color: var(--duo-blue); }

        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 8px; }
    </style>
</head>
<body>

<div class="shadowing-card">

    <!-- 步驟 1：選擇學習語言與母語 -->
    <div id="step-lang" class="step-page active">
        <h2 class="step-title"><i class="fa-solid fa-earth-americas"></i> 請選擇語言設定</h2>
        
        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">要學習的語言：</p>
        <div class="option-grid grid-3">
            <button class="btn-option" id="btn-cat-korean" onclick="selectCategory('korean')">🇰🇷 韓文</button>
            <button class="btn-option" id="btn-cat-japanese" onclick="selectCategory('japanese')">🇯🇵 日文</button>
            <button class="btn-option" id="btn-cat-english" onclick="selectCategory('english')">🇺🇸 英文</button>
        </div>

        <p style="text-align: left; font-size: 0.9rem; color: #6b7280; font-weight: bold;">你的母語（題目翻譯）：</p>
        <div class="option-grid grid-3">
            <button class="btn-option" id="btn-lang-zh" onclick="setUserLang('zh')">繁體中文</button>
            <button class="btn-option" id="btn-lang-en" onclick="setUserLang('en')">English</button>
            <button class="btn-option" id="btn-lang-ja" onclick="setUserLang('ja')">日本語</button>
        </div>

        <button class="btn-confirm" id="btn-confirm-lang" onclick="confirmLangSetting()"><i class="fa-solid fa-check"></i> 確定並進入</button>
        <div id="cache-status" style="font-size: 0.75rem; color: #9ca3af; margin-top: 8px;"></div>
    </div>

    <!-- 步驟 3：選擇單元 (Unit) -->
    <div id="step-unit" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-lang')"><i class="fa-solid fa-arrow-left"></i> 重選語言</button>
            <!-- 點擊程度即可彈出選單彈窗 -->
            <button class="btn-sub-nav" style="border-color: var(--duo-blue); color: var(--duo-blue);" onclick="openLevelModal()">
                <span id="lbl-unit-level">0A 認識字母</span> <i class="fa-solid fa-caret-down"></i>
            </button>
        </div>
        
        <h2 class="step-title"><i class="fa-solid fa-book-open"></i> 請選擇單元 (Unit)</h2>
        <div id="container-units" class="option-grid grid-3"></div>
    </div>

    <!-- 步驟 4：選擇關卡 (Stage) -->
    <div id="step-stage" class="step-page">
        <div class="top-nav">
            <button class="btn-back-step" onclick="goToStep('step-unit')"><i class="fa-solid fa-arrow-left"></i> 回單元選擇</button>
            <span id="lbl-stage-unit" style="font-weight: bold; color: var(--duo-blue);">單元 1</span>
        </div>

        <h2 class="step-title"><i class="fa-solid fa-flag-checkered"></i> 請選擇關卡 (Stage)</h2>
        <div id="container-stages" class="option-grid grid-3"></div>
    </div>

    <!-- 步驟 5：跟讀挑戰畫面 -->
    <div id="step-quiz" class="step-page">
        <div class="challenge-header-btns">
            <button class="btn-sub-nav" onclick="openLevelModal()"><i class="fa-solid fa-layer-group"></i> 換程度</button>
            <button class="btn-sub-nav" onclick="goToStep('step-unit')"><i class="fa-solid fa-book-open"></i> 回單元</button>
            <button class="btn-sub-nav" onclick="goToStep('step-stage')"><i class="fa-solid fa-flag-checkered"></i> 回關卡</button>
        </div>

        <div style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 10px;" id="lbl-quiz-info">
            韓文 | 0A | 單元 1 | 第 1 關
        </div>

        <div class="target-text" id="lbl-target-text">載入中...</div>
        <div class="translation-text" id="lbl-translation">...</div>

        <!-- 按鈕區 -->
        <div class="controls">
            <button class="btn-circle btn-listen" id="btn-play-audio" title="聽示範音">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button class="btn-circle btn-record" id="btn-start-record" title="開始跟讀">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <!-- 比對結果區 -->
        <div class="result-box">
            <div>辨識結果：<span id="lbl-recognized-text" style="font-weight: bold; color: #374151;">-</span></div>
            <div class="score-badge" id="lbl-score">得分：--</div>
        </div>

        <!-- 導覽切換按鈕 -->
        <div class="nav-controls">
            <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">上一題</button>
            <span id="lbl-progress" style="color: #6b7280; font-size: 0.9rem;">0 / 0</span>
            <button class="btn-nav" id="btn-next" onclick="nextQuestion()">下一題</button>
        </div>

        <div id="debug-info" class="error-msg"></div>
    </div>

</div>

<!-- 💡 下拉選單彈窗 Modal (如圖片樣式) -->
<div class="modal-overlay" id="modal-level">
    <div class="modal-card">
        <button class="modal-close-btn" onclick="closeLevelModal()"><i class="fa-solid fa-xmark"></i></button>
        <h3 style="margin-top: 10px; color: var(--duo-dark);">選擇課程程度</h3>
        
        <select class="modal-select" id="select-level-dropdown">
            <option value="0A">0A 認識字母</option>
            <option value="1A" selected>1A 基礎級</option>
            <option value="1B">1B 初級</option>
            <option value="2A">2A 中初級</option>
            <option value="2B">2B 中級</option>
            <option value="3A">3A 中高級</option>
            <option value="3B">3B 高級</option>
            <option value="4A">4A 精通級</option>
            <option value="TOPIK1">TOPIK 1 檢定</option>
        </select>

        <button class="btn-confirm" onclick="confirmLevelSelection()">確定切換</button>
    </div>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxNtJt1URgct9-T_yzXowKGvHeM5l17NiwviOs8ySwIbrdWD6zfctdCCx7YpMu3P7zG/exec";

    let currentConfig = {
        category: 'korean',
        level: '0A',
        unit_id: '1',
        stage: '1',
        lang: 'zh'
    };

    let globalCategoryData = []; 
    let questions = [];
    let currentIndex = 0;
    let recognition = null;

    function goToStep(stepId) {
        document.querySelectorAll('.step-page').forEach(page => page.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function selectCategory(category) {
        currentConfig.category = category;
        ['korean', 'japanese', 'english'].forEach(c => {
            const btn = document.getElementById(`btn-cat-${c}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-cat-${category}`).classList.add('selected');
        checkCacheStatus();
    }

    function setUserLang(lang) {
        currentConfig.lang = lang;
        ['zh', 'en', 'ja'].forEach(l => {
            const btn = document.getElementById(`btn-lang-${l}`);
            if (btn) btn.classList.remove('selected');
        });
        document.getElementById(`btn-lang-${lang}`).classList.add('selected');
    }

    function checkCacheStatus() {
        const cacheKey = `shadowing_data_${currentConfig.category}`;
        const cached = localStorage.getItem(cacheKey);
        const statusDiv = document.getElementById('cache-status');

        if (cached) {
            statusDiv.innerText = "⚡ 已備有本機快取（將秒速開啟）";
            statusDiv.style.color = "#10b981";
        } else {
            statusDiv.innerText = "☁️ 首次載入需連線同步（約 1~2 秒）";
            statusDiv.style.color = "#6b7280";
        }
    }

    async function confirmLangSetting() {
        const btnConfirm = document.getElementById('btn-confirm-lang');
        const cacheKey = `shadowing_data_${currentConfig.category}`;
        const cachedData = localStorage.getItem(cacheKey);

        if (cachedData) {
            globalCategoryData = JSON.parse(cachedData);
            openLevelModal(); // 進入程度彈窗選單
            return;
        }

        btnConfirm.disabled = true;
        btnConfirm.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 首次同步中...`;

        try {
            const url = `${GAS_API_URL}?action=getLanguageData&category=${encodeURIComponent(currentConfig.category)}`;
            const res = await fetch(url);
            const data = await res.json();

            if (data.status === 'success') {
                globalCategoryData = data.data;
                try {
                    localStorage.setItem(cacheKey, JSON.stringify(data.data));
                } catch(e) {
                    console.warn("本機容量不足，無法快取", e);
                }
                
                openLevelModal(); // 進入程度彈窗選單
            } else {
                alert("資料讀取失敗，請重試！");
            }
        } catch(e) {
            alert("無法連線至 API，請檢查網路狀態！");
        } finally {
            btnConfirm.disabled = false;
            btnConfirm.innerHTML = `<i class="fa-solid fa-check"></i> 確定並進入`;
        }
    }

    // 💡 彈窗對話框開關控制
    function openLevelModal() {
        document.getElementById('modal-level').classList.add('active');
    }

    function closeLevelModal() {
        document.getElementById('modal-level').classList.remove('active');
    }

    function confirmLevelSelection() {
        const select = document.getElementById('select-level-dropdown');
        const selectedVal = select.value;
        const selectedText = select.options[select.selectedIndex].text;

        currentConfig.level = selectedVal;
        document.getElementById('lbl-unit-level').innerText = selectedText;
        
        closeLevelModal();
        renderUnits(selectedVal);
        goToStep('step-unit');
    }

    // 依選取的程度顯示 Unit
    function renderUnits(level) {
        const container = document.getElementById('container-units');
        container.innerHTML = "";

        const filtered = globalCategoryData.filter(i => String(i[1]).toUpperCase() === level.toUpperCase());
        const units = [...new Set(filtered.map(i => i[2]))].filter(Boolean).sort((a,b) => a - b);

        if (units.length > 0) {
            units.forEach(u => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `第 ${u} 單元`;
                btn.onclick = () => selectUnit(u);
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = `<div style="color: #6b7280; grid-column: span 3;">此 Level 尚無單元資料</div>`;
        }
    }

    function selectUnit(unitId) {
        currentConfig.unit_id = unitId;
        document.getElementById('lbl-stage-unit').innerText = `Level ${currentConfig.level} | 第 ${unitId} 單元`;

        const container = document.getElementById('container-stages');
        container.innerHTML = "";

        const filtered = globalCategoryData.filter(i => 
            String(i[1]).toUpperCase() === currentConfig.level.toUpperCase() && 
            String(i[2]) === String(unitId)
        );
        const stages = [...new Set(filtered.map(i => i[3]))].filter(Boolean).sort((a,b) => a - b);

        if (stages.length > 0) {
            stages.forEach(s => {
                const btn = document.createElement('button');
                btn.className = "btn-option";
                btn.innerText = `第 ${s} 關`;
                btn.onclick = () => selectStage(s);
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = `<div style="color: #6b7280; grid-column: span 3;">此單元尚無關卡資料</div>`;
        }

        goToStep('step-stage');
    }

    function selectStage(stage) {
        currentConfig.stage = stage;
        goToStep('step-quiz');
        
        const catMap = { 'korean': '韓文', 'japanese': '日文', 'english': '英文' };
        document.getElementById('lbl-quiz-info').innerText = `${catMap[currentConfig.category] || currentConfig.category} | Level ${currentConfig.level} | 單元 ${currentConfig.unit_id} | 第 ${currentConfig.stage} 關`;
        
        const langIndexMap = { 'zh': 5, 'en': 6, 'ja': 7 };
        const langIdx = langIndexMap[currentConfig.lang] || 5;

        questions = globalCategoryData.filter(i => 
            String(i[1]).toUpperCase() === currentConfig.level.toUpperCase() &&
            String(i[2]) === String(currentConfig.unit_id) &&
            String(i[3]) === String(stage)
        ).map(i => ({
            id: i[0],
            text: i[4],
            translation: i[langIdx] || i[5] || '',
            audioUrl: i[8]
        }));

        currentIndex = 0;
        if (questions.length > 0) {
            displayQuestion();
        } else {
            document.getElementById('lbl-target-text').innerText = "無相關題目";
            document.getElementById('lbl-translation').innerText = "";
            document.getElementById('lbl-progress').innerText = "0 / 0";
        }
    }

    function displayQuestion() {
        if (!questions || questions.length === 0) return;

        const q = questions[currentIndex];
        document.getElementById('lbl-target-text').innerText = q.text || "無題目文字";
        document.getElementById('lbl-translation').innerText = q.translation || "";
        document.getElementById('lbl-recognized-text').innerText = "-";
        document.getElementById('lbl-score').innerText = "得分：--";

        document.getElementById('lbl-progress').innerText = `${currentIndex + 1} / ${questions.length}`;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === questions.length - 1;
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            displayQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            displayQuestion();
        }
    }

    function playAudio() {
        if (!questions[currentIndex]) return;
        const q = questions[currentIndex];

        if (q.audioUrl && q.audioUrl.trim() !== "") {
            const audio = new Audio(q.audioUrl);
            audio.play().catch(e => speakTTS(q.text));
        } else {
            speakTTS(q.text);
        }
    }

    function speakTTS(text) {
        if (!text) return;
        const synth = window.speechSynthesis;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        utterance.lang = langMap[currentConfig.category] || 'ko-KR';
        synth.speak(utterance);
    }

    function calculateSimilarity(str1, str2) {
        const s1 = str1.replace(/\s+/g, '').toLowerCase();
        const s2 = str2.replace(/\s+/g, '').toLowerCase();
        if (s1 === s2) return 100;
        
        let track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
        for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;

        for (let j = 1; j <= s2.length; j += 1) {
            for (let i = 1; i <= s1.length; i += 1) {
                const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }
        
        const distance = track[s2.length][s1.length];
        const maxLength = Math.max(s1.length, s2.length);
        const score = Math.round((1 - distance / maxLength) * 100);
        return score < 0 ? 0 : score;
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        const langMap = { 'korean': 'ko-KR', 'japanese': 'ja-JP', 'english': 'en-US' };
        recognition.lang = langMap[currentConfig.category] || 'ko-KR';

        recognition.onstart = () => {
            document.getElementById('btn-start-record').classList.add('recording');
        };

        recognition.onend = () => {
            document.getElementById('btn-start-record').classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript;
            document.getElementById('lbl-recognized-text').innerText = userSpeech;
            
            const currentQ = questions[currentIndex];
            const targetText = currentQ ? (currentQ.text || "") : "";
            const score = calculateSimilarity(targetText, userSpeech);
            document.getElementById('lbl-score').innerText = `得分：${score}分`;
        };

        recognition.onerror = () => {
            document.getElementById('btn-start-record').classList.remove('recording');
        };
    }

    document.getElementById('btn-play-audio').addEventListener('click', playAudio);
    document.getElementById('btn-start-record').addEventListener('click', () => {
        if (recognition) {
            try { recognition.start(); } catch(e) {}
        }
    });

    window.onload = () => {
        initSpeechRecognition();
        selectCategory('korean');
        setUserLang('zh');
    };
</script>

</body>
